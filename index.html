<script>var TITLES = {"en": "HSB Loyalty – CleverTap Notification Plan", "zh": "HSB Loyalty – CleverTap 通知方案", "vi": "HSB Loyalty – Kế hoạch thông báo CleverTap"};
(function () {
  var app = document.getElementById('app'), sel = document.getElementById('lang');
  var current = 'flow';
  function show(id, push) {
    app.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.dataset.tab).classList.toggle('on', on);
    });
    current = id;
    if (push) history.replaceState(null, '', '#' + id);
  }
  // Link nội bộ: mở đúng tab chứa đích rồi cuộn tới
  function go(hash) {
    var el = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (!el) return false;
    var panel = el.classList.contains('panel') ? el : el.closest('.panel');
    if (!panel) return false;
    show(panel.id, false);
    if (el !== panel) el.scrollIntoView(); else window.scrollTo(0, 0);
    return true;
  }
  function mount(lang, keepTab) {
    var tpl = document.getElementById('tpl-' + lang) || document.getElementById('tpl-en');
    app.innerHTML = tpl.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.title = TITLES[lang] || TITLES.en;
    document.body.style.overflow = '';
    sel.value = lang;
    if (keepTab) show(current, false);
    else if (!go(location.hash)) show('flow', false);
  }
  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tabs button');
    if (tab) { show(tab.dataset.tab, true); window.scrollTo(0, 0); return; }
    var a = ev.target.closest('a.ref');
    if (a && go(a.getAttribute('href'))) { ev.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); }
  });
  sel.addEventListener('change', function () {
    try { localStorage.setItem('hsb-doc-lang', sel.value); } catch (err) {}
    mount(sel.value, true);
  });
  var saved = null;
  try { saved = localStorage.getItem('hsb-doc-lang'); } catch (err) {}
  mount(saved === 'zh' || saved === 'vi' || saved === 'en' ? saved : 'en', false);
})();

(function () {
  var mode = 'sample', lang = 'id', lastFocus = null;
  function modal() { return document.getElementById('mailmodal'); }
  function apply() {
    var m = modal(), body = document.getElementById('mbody');
    m.classList.toggle('vi', lang === 'tr');
    body.querySelectorAll('.mc').forEach(function (el) {
      el.textContent = mode === 'macro' ? el.dataset.m : el.dataset.s;
      el.classList.toggle('asmacro', mode === 'macro');
    });
    m.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'); });
    m.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
  }
  function open(btn) {
    var src = document.getElementById('mail-' + btn.dataset.mail), m = modal();
    if (!src || !m) return;
    lastFocus = btn;
    document.getElementById('mbody').innerHTML = src.innerHTML;
    document.getElementById('mtitle').textContent = btn.dataset.title + ' · Email preview';
    m.hidden = false;
    document.body.style.overflow = 'hidden';
    m.scrollTop = 0;
    apply();
    m.querySelector('.mclose').focus();
  }
  function close() {
    var m = modal();
    if (!m) return;
    m.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  document.addEventListener('click', function (ev) {
    var pv = ev.target.closest('button.pv');
    if (pv) { open(pv); return; }
    var m = modal();
    if (!m || m.hidden) return;
    var md = ev.target.closest('[data-mode]'), l = ev.target.closest('[data-lang]');
    if (md) { mode = md.dataset.mode; apply(); }
    else if (l) { lang = l.dataset.lang; apply(); }
    else if (ev.target.closest('.mclose') || ev.target === m) close();
  });
  document.addEventListener('keydown', function (ev) { var m = modal(); if (ev.key === 'Escape' && m && !m.hidden) close(); });
})();
</script>
</body>
