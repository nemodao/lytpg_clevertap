<h1>HSB Loyalty Program – CleverTap notification plan</h1>
<p class="sub">Push and Email for the HSB Loyalty program. Updated: 2026-10-12.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="flow" aria-selected="false">1. Message flow</button><button type="button" role="tab" data-tab="backend" aria-selected="false">2. Backend</button><button type="button" role="tab" data-tab="frontend" aria-selected="false">3. Frontend</button><button type="button" role="tab" data-tab="content" aria-selected="false">4. Content plan</button></nav>
<section class="panel" id="flow" role="tabpanel">
<h2>1. Message flow</h2>
<p>HSB Loyalty Program lets customers earn Coin when they trade and use Coin to redeem gifts through the partner TADA. This document describes the set of Push and Email messages sent through CleverTap when the program launches: which messages are sent, to whom, when, and what backend and frontend need to do to send them. The set consists of 14 messages, using 9 events from backend and 1 event from the app.</p>

<h3>General direction</h3>
<ul>
  <li><b>The main goal is for customers to trade more.</b> Every message that drives trading is expressed in terms of gifts: "X more Coin to redeem [gift]", instead of abstract coin milestones.</li>
  <li><b>Backend evaluates the conditions, CleverTap handles copy and frequency.</b> Backend decides which customer receives which event and sends all the required variables with it. CleverTap assembles the content and applies each campaign's send limit.</li>
  <li><b>Two types of event.</b> Transactional events fire as soon as something happens (becoming eligible, first coin, redemption, coin refund). Scheduled events are produced by jobs that run at a fixed time, evaluate each customer's current state and fire in batches.</li>
  <li><b>Each customer gets at most 2 scheduled pushes per day.</b> A customer who already received a gift message at 10:00 is skipped by the 14:00 job.</li>
  <li><b>Customers who are not allowed to join the program receive no messages.</b> See the section "When a customer receives no messages" below for details.</li>
  <li><b>Indonesia market.</b> Content is in Indonesian, send times follow WIB (GMT+7), and customers are identified by <code>client_id</code>.</li>
</ul>

<h3>When a customer receives no messages</h3>
<p>Notifications use exactly the same conditions the app uses to show the trading task to a customer (the <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> definition in the Backend tab). A customer who falls into any of the following cases is considered not to be in the program:</p>
<table>
  <tr><th style="width:34%">Case</th><th>Where it is checked</th></tr>
  <tr><td>Customer is blacklisted</td><td>A blacklist at either the program level or the task bundle level blocks the customer</td></tr>
  <tr><td>Blocked by A Book / B Book</td><td>The customer's book type is hidden at any of the three levels: program, task bundle, task</td></tr>
  <tr><td>Program is turned off</td><td>Turned off at any of the three levels: program, task bundle, task</td></tr>
  <tr><td>Customer group is not in the program</td><td>The customer's group has not been assigned to the program, or the assignment row is turned off</td></tr>
  <tr><td>Display conditions not met</td><td>For HSB, this means no first deposit yet; or outside the task's display period; or the task is hidden from everyone</td></tr>
</table>
<p>How strictly this is enforced depends on the message type:</p>
<table>
  <tr><th style="width:34%">Message type</th><th style="width:22%">Message</th><th>How it is blocked</th></tr>
  <tr><td>Scheduled messages and the welcome message</td><td><a href="#msg-M2" class="ref">M2</a>, <a href="#msg-T0" class="ref">T0</a>, <a href="#msg-T5" class="ref">T5</a>, <a href="#msg-T1" class="ref">T1</a>, <a href="#msg-T4" class="ref">T4</a>, <a href="#msg-T6" class="ref">T6</a>, <a href="#msg-M10" class="ref">M10</a>, <a href="#msg-T7" class="ref">T7</a></td><td>Backend checks at the moment the job runs; no event is fired for customers who are not eligible. The block takes effect immediately</td></tr>
  <tr><td>Campaigns scheduled in CleverTap</td><td><a href="#msg-M1" class="ref">M1</a>, <a href="#msg-A1" class="ref">A1</a>, <a href="#msg-A2" class="ref">A2</a></td><td>Filtered by the user property <code>loyalty_eligible</code>, which backend syncs at 00:30 every day. The block can lag by up to one day</td></tr>
  <tr><td>Transactional messages</td><td><a href="#msg-M4" class="ref">M4</a>, <a href="#msg-M12" class="ref">M12</a>, <a href="#msg-M13" class="ref">M13</a></td><td>Participation conditions are currently not checked: a customer who has just been credited coin, redeemed a gift or been refunded coin still receives the confirmation message. Pending decision</td></tr>
</table>

<h3>Diagram 1: The customer journey and the corresponding messages</h3>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">1. Eligible</div><div class="fd">The customer makes a first deposit (FTD) and belongs to a group allowed to join the program.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M1" class="ref">M1</a></td><td class="n">Program launch</td><td>Announces that the program has launched. Sent once on launch day to every customer who is eligible at that time.</td></tr><tr><td class="c"><a href="#msg-M2" class="ref">M2</a></td><td class="n">Welcome for new customers</td><td>For customers who become eligible after launch day. Sent a few hours after the customer's first deposit, telling them their account has started earning coin.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">2. No coin yet</div><div class="fd">The customer has deposited but has not received any coin yet.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T0" class="ref">T0</a></td><td class="n">Reminder to earn the first coin</td><td>Sent at 14:00 Monday to Friday when the customer has not traded that day. Sent only within 14 days of the first deposit, at most 3 times, then stopped for good.</td></tr><tr><td class="c"><a href="#msg-A2" class="ref">A2</a></td><td class="n">Explanation of the coin earning conditions</td><td>Email for customers who have traded but whose balance is still 0 and who have never opened the program page. Explains that a position must be held for at least 3 minutes to count toward coin.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">3. First coin</div><div class="fd">The first time ever that the customer is credited coin.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M4" class="ref">M4</a></td><td class="n">Congratulations on the first coin</td><td>Sent as soon as the customer is credited coin for the first time, with a reminder that coin is used to redeem gifts.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">4. Daily accumulation</div><div class="fd">The customer trades and the coin balance grows. This is the stage where customers stay the longest and it is the focus of the message set.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T5" class="ref">T5</a></td><td class="n">Reminder based on the most recent trade</td><td>Sent at 14:00 (Monday to Friday) to customers who have not traded today but earned coin on the previous business day. Reminds them of the coin earned last time and the coin still needed to redeem the next gift. At most 2 times per week.</td></tr><tr><td class="c"><a href="#msg-T1" class="ref">T1</a></td><td class="n">No trade yet today</td><td>Sent at 14:00 (Monday to Friday) to customers who have not traded today and earned no coin on the previous business day either, but have earned coin before. Calls on them to trade today, stating the coin per lot and the coin still needed to redeem a gift. At most 1 time per week; stops once the customer has gone 14 consecutive days without coin.</td></tr><tr><td class="c"><a href="#msg-T4" class="ref">T4</a></td><td class="n">Today's summary</td><td>Sent at 19:30 (Monday to Friday) to customers who earned coin during the day. Tells them how much coin they earned today, how much more they need to redeem the next gift, and invites them to keep trading in the evening session. At most 3 times per week.</td></tr><tr><td class="c"><a href="#msg-T7" class="ref">T7</a></td><td class="n">Weekly summary</td><td>Email sent on Saturday morning to customers who earned coin during the week. Includes the week's coin, the number of days with trades, the current balance, and a table of 3 gifts with the progress percentage toward each.</td></tr><tr><td class="c"><a href="#msg-A1" class="ref">A1</a></td><td class="n">Has coin but has not viewed the page</td><td>For customers who have 100 coin or more but have never opened the program page in the app. Tells them how much coin they have and which gifts they can redeem. Sent on day 3 and day 10 after the customer becomes eligible.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">5. Reaching a gift</div><div class="fd">The coin balance gets close to or reaches the price of a target gift.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T6" class="ref">T6</a></td><td class="n">Almost enough to redeem a gift</td><td>Sent when the balance first reaches 70% of the price of the next gift. Each customer receives it only once in their lifetime.</td></tr><tr><td class="c"><a href="#msg-M10" class="ref">M10</a></td><td class="n">Enough to redeem a gift</td><td>Sent when the balance is first enough to redeem a gift. Each customer receives it only once in their lifetime.</td></tr></table><div class="fnote" id="note-gift"><b>Note: this is a solution specific to the phase 1 launch.</b> The two gift-reaching reminders were designed while our understanding of the TADA system is still limited. Each message is therefore sent only <b>once in a lifetime</b> per customer, to avoid spam. Once the TADA integration is complete and the system is well understood, this part can be removed and replaced by a more engaging set of gift and reward notifications.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">6. Redemption</div><div class="fd">The customer redeems coin for a gift in the TADA webview. At this stage two parties send messages to the customer.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M12" class="ref">M12</a></td><td class="n">Redemption successful</td><td>Sent by HSB through CleverTap, as soon as the coin is deducted. Confirms the coin only: how much coin was redeemed and the remaining balance. This message does not contain the voucher.</td></tr><tr><td class="c"><a href="#msg-M13" class="ref">M13</a></td><td class="n">Coin refund</td><td>Sent by HSB through CleverTap, as soon as the coin of a redemption is refunded. Confirms only the coin refunded and the new balance.</td></tr></table><div class="fnote" id="note-tada"><b>Who sends what in the redemption flow:</b><table class="inner"><tr><th>Sender</th><th>What is sent</th><th>Channel</th><th>Covered in this document</th></tr><tr><td>TADA</td><td>The gift's voucher: the gift code and instructions for use</td><td>Email from TADA's system</td><td>No. HSB does not write or control this content</td></tr><tr><td>HSB (through CleverTap)</td><td>Coin confirmation: M12 when coin is deducted, M13 when coin is refunded</td><td>M12: Push. M13: Push and Email</td><td>Yes</td></tr></table>M12 has no Email so that the customer does not receive two emails at once for a single redemption.</div></div></div>
<p class="note">After redeeming a gift, the customer returns to stage 4 and keeps accumulating. Click a message code to see the detailed copy.</p>

<h3>Diagram 2: A day of the scheduled jobs</h3>
<p>The three jobs below run one after another during the day. In each job, backend evaluates the conditions from top to bottom and stops at the first one that matches.</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">10:00 WIB, every day including weekends</div><div class="fd"><b>Gift job</b></div><div class="fd">Every morning, backend compares each customer's coin balance with the list of target gifts, to tell customers the first time they are almost at, or have reached, enough coin to redeem a gift. Each customer receives each type of message only once in their lifetime; for the reason, see <a href="#note-gift" class="ref">the note in stage 5. Reaching a gift</a> of diagram 1.<br><br>The list of target gifts is configured on the HSB side: it copies the details of a number of attractive gifts that we have configured on TADA, with the same coin amounts. Details are in the <a href="#tbl-point_notify_gift_target" class="ref">point_notify_gift_target</a> table in the Backend tab.</div></div><table class="fmsg"><tr><th class="c">Evaluation order</th><th>Condition</th><th class="r">Result</th></tr><tr><td class="c">1</td><td>The balance is enough to redeem at least one gift, and the customer has never received the "enough to redeem a gift" message</td><td class="r">Send <a href="#msg-M10" class="ref">M10</a> for the most expensive gift the customer has enough coin to redeem</td></tr><tr><td class="c">2</td><td>Not the case above; the balance has reached 70% or more of the price of the next gift, and the customer has never received the "almost enough to redeem a gift" message</td><td class="r">Send <a href="#msg-T6" class="ref">T6</a> for that gift</td></tr><tr><td class="c">3</td><td>All other cases</td><td class="r">Do not send</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">14:00 WIB, Monday to Friday</div><div class="fd"><b>Early afternoon reminder</b></div><div class="fd">In the early afternoon, backend finds customers who have not traded today and reminds them to come in and trade. The reminder content varies with the customer's history, and each customer receives at most one message.</div></div><table class="fmsg"><tr><th class="c">Evaluation order</th><th>Condition</th><th class="r">Result</th></tr><tr><td class="c">1</td><td>The customer received a gift message at 10:00 today</td><td class="r">Do not send, to avoid two messages in the same part of the day</td></tr><tr><td class="c">2</td><td>The customer has opened or closed at least one position on MT5 today</td><td class="r">Do not send, because the customer has already traded</td></tr><tr><td class="c">3</td><td>The customer has never earned coin, and is still within 14 days of the first deposit</td><td class="r">Send <a href="#msg-T0" class="ref">T0</a></td></tr><tr><td class="c">4</td><td>The customer has earned coin before, and earned coin on the previous business day (without hitting that day's daily cap)</td><td class="r">Send <a href="#msg-T5" class="ref">T5</a></td></tr><tr><td class="c">5</td><td>The customer has earned coin before, earned no coin on the previous business day, and last earned coin no more than 14 days ago</td><td class="r">Send <a href="#msg-T1" class="ref">T1</a></td></tr><tr><td class="c">6</td><td>All other cases, for example more than 14 days after the first deposit with no coin yet, or more than 14 days without earning coin</td><td class="r">Do not send</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">19:30 WIB, Monday to Friday</div><div class="fd"><b>Daily summary</b></div><div class="fd">In the evening, before the US session, backend sends a summary to customers who earned coin during the day: how much coin they earned today and how much more they need to redeem the next gift.</div></div><table class="fmsg"><tr><th class="c">Evaluation order</th><th>Condition</th><th class="r">Result</th></tr><tr><td class="c">1</td><td>The customer earned coin today, even if they have hit the daily cap</td><td class="r">Send <a href="#msg-T4" class="ref">T4</a></td></tr><tr><td class="c">2</td><td>The customer earned no coin today</td><td class="r">Do not send</td></tr></table></div></div>
<p class="note">Outside the three jobs above: the weekly summary email (<a href="#msg-T7" class="ref">T7</a>) is sent on Saturday morning at 09:00 WIB; the messages <a href="#msg-M2" class="ref">M2</a>, <a href="#msg-M4" class="ref">M4</a>, <a href="#msg-M12" class="ref">M12</a>, <a href="#msg-M13" class="ref">M13</a> are sent as soon as the event happens; <a href="#msg-A1" class="ref">A1</a> and <a href="#msg-A2" class="ref">A2</a> are campaigns scheduled in CleverTap.</p>

<h2>2. Backend work</h2>
<p>Backend needs to create 2 new tables, fire 9 events to CleverTap, and update 6 user properties. Event and property names are written in <code>snake_case</code>. The queries are written against the existing table structure and have not been run on the DB.</p>

<h3>2.1 New tables</h3>
<h4 id="tbl-point_notify_gift_target"><code>point_notify_gift_target</code></h4><p>The list of target gifts configured by HSB itself, used to compute the 'next gift' and 'how much coin is still needed' in the messages. Each row copies the details of an attractive gift that HSB has configured on TADA, with the same coin amount. It is entered manually and not synced automatically from TADA, so this table must be updated whenever a gift or a price changes on TADA. Expected 5–6 rows</p><div class="scroll"><table><tr><th style="width:20%">Column</th><th style="width:15%">Type</th><th style="width:8%">Required</th><th style="width:19%">Example</th><th>Meaning</th></tr><tr><td><code>id</code></td><td>bigint, auto-increment</td><td>Yes</td><td>1</td><td>Primary key</td></tr><tr><td><code>program_id</code></td><td>bigint</td><td>Yes</td><td>1001</td><td>The program it applies to, pointing to point_program.id</td></tr><tr><td><code>gift_name</code></td><td>varchar(128)</td><td>Yes</td><td>Saldo GoPay Rp50.000</td><td>Full name of the gift, used in email</td></tr><tr><td><code>gift_short_name</code></td><td>varchar(32)</td><td>Yes</td><td>GoPay Rp50.000</td><td>Short name used in push. Keep it under 25 characters so the push title is not truncated</td></tr><tr><td><code>point_price</code></td><td>bigint</td><td>Yes</td><td>500</td><td>Coin price of the gift, which must exactly match the price configured on TADA. Two active gifts in the same program must not have the same price</td></tr><tr><td><code>gift_image_url</code></td><td>varchar(512)</td><td>No</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>Path to the gift's image, sent with the event to CleverTap for display in email. It must be a public https link that requires no login, hosted on HSB's image server so the link does not change. If left empty, the email is shown without an image</td></tr><tr><td><code>enabled</code></td><td>tinyint</td><td>Yes</td><td>1</td><td>1 = in use, 0 = off. If all rows are off, the messages no longer mention gifts</td></tr><tr><td><code>remark</code></td><td>varchar(255)</td><td>No</td><td>Reconciled with TADA on 2026-11-01</td><td>Free-form notes, for example the date the price was last reconciled with TADA</td></tr><tr><td><code>create_date, create_user, update_date, update_user</code></td><td>same as the other point_ tables</td><td>Yes</td><td></td><td>Creation and modification details</td></tr></table></div><h4 id="tbl-point_notify_log"><code>point_notify_log</code></h4><p>Records every event backend has fired to CleverTap, to prevent duplicate firing and to check the limits (once in a lifetime, once per day, once per week)</p><div class="scroll"><table><tr><th style="width:20%">Column</th><th style="width:15%">Type</th><th style="width:8%">Required</th><th style="width:19%">Example</th><th>Meaning</th></tr><tr><td><code>id</code></td><td>bigint, auto-increment</td><td>Yes</td><td>1</td><td>Primary key</td></tr><tr><td><code>client_id</code></td><td>bigint</td><td>Yes</td><td>7200123</td><td>The customer receiving the event</td></tr><tr><td><code>event_name</code></td><td>varchar(64)</td><td>Yes</td><td>first_gift_reachable</td><td>Name of the event fired</td></tr><tr><td><code>ref_key</code></td><td>varchar(64)</td><td>Yes</td><td>2026-11-03</td><td>Deduplication key per event type: once-in-a-lifetime events use 'lifetime'; daily events use the GMT+7 date; weekly events use the Saturday of the week; coin_redeemed and coin_refunded use redemption_id</td></tr><tr><td><code>payload</code></td><td>json</td><td>No</td><td>{"gift_name":"GoPay Rp50.000"}</td><td>The properties sent with the event, for tracing when a customer has a question</td></tr><tr><td><code>send_status</code></td><td>tinyint</td><td>Yes</td><td>1</td><td>1 = CleverTap received it successfully, 0 = error</td></tr><tr><td><code>create_date</code></td><td>datetime</td><td>Yes</td><td></td><td>When fired</td></tr><tr><td>(unique key)</td><td>client_id + event_name + ref_key</td><td></td><td></td><td>Prevents duplicate firing at the database level</td></tr></table></div>

<h3>2.2 Events and event properties</h3>
<p>Each event is sent to CleverTap through the server-side upload API, identifying the customer by <code>client_id</code>. Example:</p>
<pre>{
  "d": [{
    "identity": "7200123",
    "type": "event",
    "evtName": "loyalty_daily_summary",
    "evtData": { "today_coin": 140, "coin_balance": 460, "next_gift_name": "GoPay Rp50.000", "coin_to_next_gift": 40 }
  }]
}</pre>
<p>The run time of each event is given in the "When fired" row of that event's block; these times are kept as configuration.</p>
<p>On every successful fire, write one row to <code>point_notify_log</code>. The uppercase names in the "How to compute" column (for example <code>BALANCE</code>) are the shared definitions in section 2.4.</p>
<p><b>Number display convention:</b> The Indonesian-formatted string version of each numeric property is used for display (for example coin_balance_text).</p>
<div class="scroll evblock" id="ev-loyalty_enrolled"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_enrolled</code><span class="evmeta">Used for messages: <a href="#msg-M2" class="ref">M2</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>The customer becomes eligible for the program for the first time, after launch day. For a new customer, this is in practice the moment the first deposit completes; it can also be when the customer is removed from the blacklist or the program is turned on for the customer's group</dd><dt>When fired</dt><dd>Job scans every 10 minutes</dd><dt>How to determine</dt><dd class="q">Take customers in <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> who do not yet have a <code class="sql">event_name = <span class="str">'loyalty_enrolled'</span></code> row in <code class="sql">point_notify_log</code></dd><dt>Deduplication</dt><dd class="q">Once in a lifetime per customer, recorded in <code class="sql">point_notify_log</code></dd><dt>Notes</dt><dd>Before launch time: pre-write point_notify_log for all customers who are currently ELIGIBLE but do NOT fire the event (this group receives M1). New table to create: point_notify_log (id, client_id, event_name, ref_key, create_date)</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>coin_per_lot</code></td><td>number</td><td>80</td><td>The highest coin per lot the customer can earn</td><td class="q"><a href="#def-COIN_PER_LOT" class="ref">COIN_PER_LOT</a></td></tr><tr><td><code>enrolled_at</code></td><td>datetime</td><td>2026-11-02T09:15:00+07:00</td><td>Time of becoming eligible</td><td class="q">The time the job detects it</td></tr></table></div><div class="scroll evblock" id="ev-coin_first_earned"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">coin_first_earned</code><span class="evmeta">Used for messages: <a href="#msg-M4" class="ref">M4</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>The first time ever that the customer is credited coin</dd><dt>When fired</dt><dd>Right after the point distribution job writes the coin credit row</dd><dt>How to determine</dt><dd class="q">A new <code class="sql">point_ledger</code> row has <code class="sql">type = <span class="num">1</span></code> and <code class="sql">point_amount &gt; <span class="num">0</span></code>, and no such row existed before. Check with the following query, whose result must be 0: <code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COUNT</span>(*)
<span class="kw">FROM</span> point_ledger
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> type = <span class="num">1</span>
  <span class="kw">AND</span> point_amount &gt; <span class="num">0</span>
  <span class="kw">AND</span> id &lt; <span class="prm">:new_row_id</span></code></dd><dt>Deduplication</dt><dd class="q">Once in a lifetime per customer, recorded in <code class="sql">point_notify_log</code></dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>coin_amount</code></td><td>number</td><td>80</td><td>Coin amount of the first credit</td><td class="q"><code class="sql">point_ledger.point_amount</code> of the new row</td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>Current coin balance</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the next gift; empty if no gift is priced above the balance</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>Coin still needed to redeem the next gift</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr></table></div><div class="scroll evblock" id="ev-loyalty_daily_nudge"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_daily_nudge</code><span class="evmeta">Used for messages: <a href="#msg-T0" class="ref">T0</a>, <a href="#msg-T5" class="ref">T5</a>, <a href="#msg-T1" class="ref">T1</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>Early afternoon reminder for customers who have not traded during the day. Each customer belongs to exactly one type (nudge_type) or receives nothing</dd><dt>When fired</dt><dd>Job at 14:00 WIB, Monday to Friday</dd><dt>How to determine</dt><dd class="q">For each customer in <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> who has not traded today (<a href="#def-TRADED_TODAY" class="ref">TRADED_TODAY</a> returns no rows) and has not received a gift event today, evaluate in order: (1) if <a href="#def-LIFETIME" class="ref">LIFETIME</a> equals 0 and the customer is still within 14 days of the first deposit, then <code class="sql">nudge_type = first_coin</code>; (2) if <a href="#def-LIFETIME" class="ref">LIFETIME</a> is greater than 0, the coin of <a href="#def-PREV_TRADING_DAY" class="ref">PREV_TRADING_DAY</a> is greater than 0 and that day's daily cap was not hit, then <code class="sql">nudge_type = last_trade_earned</code>; (3) if <a href="#def-LIFETIME" class="ref">LIFETIME</a> is greater than 0, the coin of <a href="#def-PREV_TRADING_DAY" class="ref">PREV_TRADING_DAY</a> equals 0 and the most recent day with coin is no more than 14 days before today, then <code class="sql">nudge_type = not_traded</code>; otherwise do not fire. Not having received a gift event today means the following query returns no rows: <code class="sql blk"><span class="kw">SELECT</span> <span class="num">1</span>
<span class="kw">FROM</span> point_notify_log
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> event_name <span class="kw">IN</span> (<span class="str">'first_gift_reachable'</span>,<span class="str">'first_gift_almost_reached'</span>)
  <span class="kw">AND</span> create_date &gt;= <span class="prm">:today_start_gmt7</span></code> Still within 14 days of the first deposit: <code class="sql"><span class="fn">NOW</span>() &lt;= <span class="fn">FROM_UNIXTIME</span>(first_deposit_time / <span class="num">1000</span>) + <span class="kw">INTERVAL</span> <span class="num">14</span> <span class="kw">DAY</span></code> Coin of a given day: <code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="fn">SUM</span>(point_earned),<span class="num">0</span>)
<span class="kw">FROM</span> point_task_trading_log
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> period_key = <span class="prm">:period_key</span></code> Daily cap hit: <code class="sql">point_max_cap_enabled = <span class="num">1</span> <span class="kw">AND</span> point_earned &gt;= point_max_cap_value</code> Most recent day with coin: <code class="sql blk"><span class="kw">SELECT</span> <span class="fn">MAX</span>(period_key) <span class="kw">FROM</span> point_task_trading_log <span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span> <span class="kw">AND</span> point_earned &gt; <span class="num">0</span></code></dd><dt>Deduplication</dt><dd class="q">At most 1 event per customer per day</dd><dt>Notes</dt><dd>The length of the FTD window (14 days) and the stop threshold of T1 (14) are two separate configurations. first_deposit_time is stored in milliseconds</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>nudge_type</code></td><td>string</td><td>last_trade_earned</td><td>Reminder type: first_coin / last_trade_earned / not_traded</td><td class="q">Following the evaluation order in the How to determine row above</td></tr><tr><td><code>last_coin</code></td><td>number</td><td>140</td><td>Coin the customer earned on the previous business day; 0 if none</td><td class="q"><code class="sql"><span class="fn">SUM</span>(point_task_trading_log.point_earned)</code> of <a href="#def-PREV_TRADING_DAY" class="ref">PREV_TRADING_DAY</a></td></tr><tr><td><code>coin_per_lot</code></td><td>number</td><td>80</td><td>The highest coin per lot the customer can earn</td><td class="q"><a href="#def-COIN_PER_LOT" class="ref">COIN_PER_LOT</a></td></tr><tr><td><code>days_since_ftd</code></td><td>number</td><td>3</td><td>Number of days since the first deposit</td><td class="q"><code class="sql blk"><span class="fn">FLOOR</span>((<span class="fn">UNIX_TIMESTAMP</span>() * <span class="num">1000</span> - crm_customer_base.first_deposit_time) / <span class="num">86400000</span>)</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>Current coin balance</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the next gift; empty if no gift is priced above the balance</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>Coin still needed to redeem the next gift</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr></table></div><div class="scroll evblock" id="ev-loyalty_daily_summary"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_daily_summary</code><span class="evmeta">Used for messages: <a href="#msg-T4" class="ref">T4</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>Evening summary for customers who earned coin during the day. Customers who have hit the daily cap still receive this message</dd><dt>When fired</dt><dd>Job at 19:30 WIB, Monday to Friday</dd><dt>How to determine</dt><dd class="q">Customers in <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> for whom the following query returns a result greater than 0: <code class="sql blk"><span class="kw">SELECT</span> <span class="fn">SUM</span>(point_earned) <span class="kw">FROM</span> point_task_trading_log <span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span> <span class="kw">AND</span> period_key = <a href="#def-TODAY_KEY" class="ref">TODAY_KEY</a></code></dd><dt>Deduplication</dt><dd class="q">At most 1 event per customer per day</dd><dt>Notes</dt><dd>Run time is kept as configuration</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>today_coin</code></td><td>number</td><td>140</td><td>Coin earned today</td><td class="q"><code class="sql"><span class="fn">SUM</span>(point_task_trading_log.point_earned)</code> of <a href="#def-TODAY_KEY" class="ref">TODAY_KEY</a></td></tr><tr><td><code>reachable_gift_name</code></td><td>string</td><td>Saldo GoPay Rp25.000</td><td>The most expensive gift the customer has enough coin to redeem; empty if none is affordable yet</td><td class="q"><code class="sql"><a href="#def-REACHABLE_GIFT" class="ref">REACHABLE_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>Current coin balance</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the next gift; empty if no gift is priced above the balance</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>Coin still needed to redeem the next gift</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr></table></div><div class="scroll evblock" id="ev-first_gift_reachable"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">first_gift_reachable</code><span class="evmeta">Used for messages: <a href="#msg-M10" class="ref">M10</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>The first time ever that the customer's balance is enough to redeem at least one target gift. The purpose is to create the first push to act; each customer receives it only once in their lifetime</dd><dt>When fired</dt><dd>Gift job, 10:00 WIB every day including weekends</dd><dt>How to determine</dt><dd class="q">For each customer in <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> who does not yet have a <code class="sql">event_name = <span class="str">'first_gift_reachable'</span></code> row in <code class="sql">point_notify_log</code>: if <a href="#def-REACHABLE_GIFT" class="ref">REACHABLE_GIFT</a> returns a row, fire the event for that gift (the most expensive gift the customer has enough coin for). Evaluate using the balance at the time the job runs; there is no need to catch the moment the balance crosses the threshold</dd><dt>Deduplication</dt><dd class="q">Once in a lifetime per customer, recorded in <code class="sql">point_notify_log</code></dd><dt>Notes</dt><dd>The gift job evaluates first_gift_reachable first, and only evaluates first_gift_almost_reached if it is not satisfied; at most 1 gift event per customer per run. There is a switch to turn the gift job off. The names carry the first_ prefix so that other gift events with a higher frequency can be added later without name clashes</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the gift</td><td class="q"><code class="sql">point_notify_gift_target.gift_short_name</code></td></tr><tr><td><code>gift_price</code></td><td>number</td><td>500</td><td>Coin price of the gift</td><td class="q"><code class="sql">point_notify_gift_target.point_price</code></td></tr><tr><td><code>gift_image_url</code></td><td>string</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>Image link of the gift, used in email; empty if not configured</td><td class="q"><code class="sql">point_notify_gift_target.gift_image_url</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>410</td><td>Current coin balance</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr></table></div><div class="scroll evblock" id="ev-first_gift_almost_reached"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">first_gift_almost_reached</code><span class="evmeta">Used for messages: <a href="#msg-T6" class="ref">T6</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>The first time ever that the customer's balance reaches 70% or more of the price of the next gift but is not yet enough to redeem it. Each customer receives it only once in their lifetime</dd><dt>When fired</dt><dd>Gift job, 10:00 WIB every day including weekends (same job as first_gift_reachable)</dd><dt>How to determine</dt><dd class="q">For each customer in <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> who does not yet have a <code class="sql">event_name = <span class="str">'first_gift_almost_reached'</span></code> row in <code class="sql">point_notify_log</code> and does not satisfy the first_gift_reachable condition in this run: take <a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>; if <code class="sql"><a href="#def-BALANCE" class="ref">BALANCE</a> &gt;= <span class="num">0.7</span> * <a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price</code>, fire the event for that gift</dd><dt>Deduplication</dt><dd class="q">Once in a lifetime per customer, recorded in <code class="sql">point_notify_log</code></dd><dt>Notes</dt><dd>The 70% ratio is kept as configuration. Shares the off switch with first_gift_reachable</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the gift</td><td class="q"><code class="sql">point_notify_gift_target.gift_short_name</code></td></tr><tr><td><code>gift_price</code></td><td>number</td><td>500</td><td>Coin price of the gift</td><td class="q"><code class="sql">point_notify_gift_target.point_price</code></td></tr><tr><td><code>gift_image_url</code></td><td>string</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>Image link of the gift, used in email; empty if not configured</td><td class="q"><code class="sql">point_notify_gift_target.gift_image_url</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>410</td><td>Current coin balance</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>coin_to_gift</code></td><td>number</td><td>90</td><td>Coin still needed to redeem this gift</td><td class="q"><code class="sql">gift_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr><tr><td><code>lot_to_gift</code></td><td>number</td><td>2</td><td>Estimated lots still needed, rounded up</td><td class="q"><code class="sql"><span class="fn">CEIL</span>(coin_to_gift / <a href="#def-COIN_PER_LOT" class="ref">COIN_PER_LOT</a>)</code></td></tr></table></div><div class="scroll evblock" id="ev-loyalty_weekly_summary"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_weekly_summary</code><span class="evmeta">Used for messages: <a href="#msg-T7" class="ref">T7</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>Summary of coin over the past 7 days for customers who earned coin during the week</dd><dt>When fired</dt><dd>Job on Saturday, 09:00 WIB</dd><dt>How to determine</dt><dd class="q">Customers in <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> for whom the following query returns <code class="sql">week_coin</code> greater than 0 (<code class="sql"><span class="prm">:week_start_date</span></code> is last week's Saturday, <code class="sql"><span class="prm">:week_end_date</span></code> is the Friday just passed): <code class="sql blk"><span class="kw">SELECT</span> <span class="fn">SUM</span>(point_earned) <span class="kw">AS</span> week_coin, <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> <span class="kw">CASE</span> <span class="kw">WHEN</span> point_earned &gt; <span class="num">0</span> <span class="kw">THEN</span> period_key <span class="kw">END</span>) <span class="kw">AS</span> trading_days
<span class="kw">FROM</span> point_task_trading_log
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> period_key <span class="kw">BETWEEN</span> <span class="prm">:week_start_date</span>
  <span class="kw">AND</span> <span class="prm">:week_end_date</span></code></dd><dt>Deduplication</dt><dd class="q">1 event per customer per week</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>week_coin</code></td><td>number</td><td>620</td><td>Coin earned in the past 7 days</td><td class="q">See the query in the How to determine row above</td></tr><tr><td><code>trading_days</code></td><td>number</td><td>4</td><td>Number of days with coin earned in the past 7 days</td><td class="q">See the query in the How to determine row above</td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>Current coin balance</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the next gift; empty if no gift is priced above the balance</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>Coin still needed to redeem the next gift</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr><tr><td><code>gift_1_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the gift in slot 1; empty if there are fewer than 3 gifts</td><td class="q">Slot 1 is <a href="#def-REACHABLE_GIFT" class="ref">REACHABLE_GIFT</a> if there is one; the remaining slots are the gifts priced above the balance, in ascending price order. If no gift is affordable yet, all 3 slots are the 3 nearest gifts above the balance</td></tr><tr><td><code>gift_1_price</code></td><td>number</td><td>500</td><td>Coin price of the gift in slot 1</td><td class="q"><code class="sql">point_notify_gift_target.point_price</code></td></tr><tr><td><code>gift_1_image_url</code></td><td>string</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>Image link of the gift in slot 1; empty if not configured</td><td class="q"><code class="sql">point_notify_gift_target.gift_image_url</code></td></tr><tr><td><code>gift_1_percent</code></td><td>number</td><td>64</td><td>Progress toward the gift in slot 1, from 0 to 100</td><td class="q"><code class="sql"><span class="fn">LEAST</span>(<span class="num">100</span>, <span class="fn">FLOOR</span>(<a href="#def-BALANCE" class="ref">BALANCE</a> * <span class="num">100</span> / point_price))</code></td></tr><tr><td><code>gift_1_status</code></td><td>string</td><td>in_progress</td><td>Status of the gift in slot 1: reachable (enough coin) / in_progress (not enough yet)</td><td class="q"><code class="sql">reachable</code> when <code class="sql"><a href="#def-BALANCE" class="ref">BALANCE</a> &gt;= point_price</code>, otherwise <code class="sql">in_progress</code></td></tr><tr><td><code>gift_2_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the gift in slot 2; empty if there are fewer than 3 gifts</td><td class="q">Slot 1 is <a href="#def-REACHABLE_GIFT" class="ref">REACHABLE_GIFT</a> if there is one; the remaining slots are the gifts priced above the balance, in ascending price order. If no gift is affordable yet, all 3 slots are the 3 nearest gifts above the balance</td></tr><tr><td><code>gift_2_price</code></td><td>number</td><td>500</td><td>Coin price of the gift in slot 2</td><td class="q"><code class="sql">point_notify_gift_target.point_price</code></td></tr><tr><td><code>gift_2_image_url</code></td><td>string</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>Image link of the gift in slot 2; empty if not configured</td><td class="q"><code class="sql">point_notify_gift_target.gift_image_url</code></td></tr><tr><td><code>gift_2_percent</code></td><td>number</td><td>64</td><td>Progress toward the gift in slot 2, from 0 to 100</td><td class="q"><code class="sql"><span class="fn">LEAST</span>(<span class="num">100</span>, <span class="fn">FLOOR</span>(<a href="#def-BALANCE" class="ref">BALANCE</a> * <span class="num">100</span> / point_price))</code></td></tr><tr><td><code>gift_2_status</code></td><td>string</td><td>in_progress</td><td>Status of the gift in slot 2: reachable (enough coin) / in_progress (not enough yet)</td><td class="q"><code class="sql">reachable</code> when <code class="sql"><a href="#def-BALANCE" class="ref">BALANCE</a> &gt;= point_price</code>, otherwise <code class="sql">in_progress</code></td></tr><tr><td><code>gift_3_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Short name of the gift in slot 3; empty if there are fewer than 3 gifts</td><td class="q">Slot 1 is <a href="#def-REACHABLE_GIFT" class="ref">REACHABLE_GIFT</a> if there is one; the remaining slots are the gifts priced above the balance, in ascending price order. If no gift is affordable yet, all 3 slots are the 3 nearest gifts above the balance</td></tr><tr><td><code>gift_3_price</code></td><td>number</td><td>500</td><td>Coin price of the gift in slot 3</td><td class="q"><code class="sql">point_notify_gift_target.point_price</code></td></tr><tr><td><code>gift_3_image_url</code></td><td>string</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>Image link of the gift in slot 3; empty if not configured</td><td class="q"><code class="sql">point_notify_gift_target.gift_image_url</code></td></tr><tr><td><code>gift_3_percent</code></td><td>number</td><td>64</td><td>Progress toward the gift in slot 3, from 0 to 100</td><td class="q"><code class="sql"><span class="fn">LEAST</span>(<span class="num">100</span>, <span class="fn">FLOOR</span>(<a href="#def-BALANCE" class="ref">BALANCE</a> * <span class="num">100</span> / point_price))</code></td></tr><tr><td><code>gift_3_status</code></td><td>string</td><td>in_progress</td><td>Status of the gift in slot 3: reachable (enough coin) / in_progress (not enough yet)</td><td class="q"><code class="sql">reachable</code> when <code class="sql"><a href="#def-BALANCE" class="ref">BALANCE</a> &gt;= point_price</code>, otherwise <code class="sql">in_progress</code></td></tr></table></div><div class="scroll evblock" id="ev-coin_redeemed"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">coin_redeemed</code><span class="evmeta">Used for messages: <a href="#msg-M12" class="ref">M12</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>The customer redeemed a gift successfully and the coin has been deducted</dd><dt>When fired</dt><dd>Right after the coin deduction request from TADA has been processed</dd><dt>How to determine</dt><dd class="q">The <code class="sql">point_ledger</code> rows that have <code class="sql">type = <span class="num">2</span></code> and <code class="sql">source_type = <span class="num">3</span></code> for the same <code class="sql">redemption_id</code>. One redemption can deduct from several batches, so group by <code class="sql">redemption_id</code>: <code class="sql blk"><span class="kw">SELECT</span> redemption_id, -<span class="fn">SUM</span>(point_amount) <span class="kw">AS</span> coin_spent
<span class="kw">FROM</span> point_ledger
<span class="kw">WHERE</span> redemption_id = <span class="prm">:redemption_id</span>
  <span class="kw">AND</span> type = <span class="num">2</span>
<span class="kw">GROUP BY</span> redemption_id</code></dd><dt>Deduplication</dt><dd class="q">1 event per <code class="sql">redemption_id</code></dd><dt>Notes</dt><dd>PENDING: at the time of planning, 2026-10-10, the TADA module does not exist yet. The query is written against the existing point_ledger structure and must be reviewed and corrected once the TADA module is complete</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>coin_spent</code></td><td>number</td><td>500</td><td>Coin deducted for this redemption</td><td class="q"><code class="sql">-<span class="fn">SUM</span>(point_ledger.point_amount)</code> by <code class="sql">redemption_id</code>, with <code class="sql">type = <span class="num">2</span></code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>20</td><td>Balance after the deduction</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>redemption_id</code></td><td>string</td><td>10231</td><td>Redemption ID</td><td class="q"><code class="sql">point_ledger.redemption_id</code></td></tr></table></div><div class="scroll evblock" id="ev-coin_refunded"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">coin_refunded</code><span class="evmeta">Used for messages: <a href="#msg-M13" class="ref">M13</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Definition</dt><dd>The coin of a redemption is refunded to the customer</dd><dt>When fired</dt><dd>Right after the coin refund request from TADA has been processed</dd><dt>How to determine</dt><dd class="q">The <code class="sql">point_ledger</code> rows that have <code class="sql">type = <span class="num">3</span></code> for the same <code class="sql">redemption_id</code>: <code class="sql blk"><span class="kw">SELECT</span> redemption_id, <span class="fn">SUM</span>(point_amount) <span class="kw">AS</span> coin_refunded
<span class="kw">FROM</span> point_ledger
<span class="kw">WHERE</span> redemption_id = <span class="prm">:redemption_id</span>
  <span class="kw">AND</span> type = <span class="num">3</span>
<span class="kw">GROUP BY</span> redemption_id</code></dd><dt>Deduplication</dt><dd class="q">1 event per refund</dd><dt>Notes</dt><dd>PENDING: at the time of planning, 2026-10-10, the TADA module does not exist yet. The query is written against the existing point_ledger structure and must be reviewed and corrected once the TADA module is complete. The gift name and refund reason depend on the data TADA sends</dd></dl></td></tr><tr><th>Property</th><th>Type</th><th>Example</th><th>Meaning</th><th>How to compute</th></tr><tr><td><code>coin_refunded</code></td><td>number</td><td>500</td><td>Coin refunded</td><td class="q"><code class="sql"><span class="fn">SUM</span>(point_ledger.point_amount)</code> by <code class="sql">redemption_id</code>, with <code class="sql">type = <span class="num">3</span></code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>520</td><td>Balance after the refund</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>redemption_id</code></td><td>string</td><td>10231</td><td>Redemption ID</td><td class="q"><code class="sql">point_ledger.redemption_id</code></td></tr></table></div>

<h3>2.3 User properties</h3>
<p>User properties are used for campaigns that have no accompanying event (M1, A1, A2) and to exclude customers who are no longer eligible.</p>
<p><b>Update schedule:</b> user properties are updated in two ways. Immediately: whenever backend fires an event for a customer, it also updates that customer's user properties in the same call. On schedule: a sync job runs at <b>00:30 WIB every day</b> and updates customers who had changes during the day without any event being fired (for example expired coin, or the customer being blacklisted). The "When updated" column states which way each user property uses.</p>

uring the day</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td><td>Insert content for A1</td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>Coin still needed to redeem the next gift</td><td>Real time: whenever the backend fires any event for the customer. Scheduled: the sync job at 00:30 WIB every day, for customers whose balance changed during the day</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td><td>Insert content for A1</td></tr>

<h3>2.4 Shared definitions</h3>
<p>Concepts that recur across several events are defined once here.</p>
<div class="scroll"><table>
  <tr><th style="width:13%">Name</th><th style="width:24%">Definition</th><th style="width:40%">How to determine</th><th>Notes</th></tr>
  <tr id="def-ELIGIBLE"><td><code>ELIGIBLE</code></td><td>The customer is allowed to participate in the program at the time of evaluation, meaning the app is showing the trading task to the customer. The customer is excluded in any of the following cases: (1) the customer group has not been assigned to the program, or the assignment row is disabled; (2) the program, task bundle or task is disabled; (3) the customer's book type (A Book / B Book) is hidden at program, task bundle or task level; (4) the customer is blacklisted at program level or task bundle level; (5) the customer has not met the task's display condition (for HSB, having made the first deposit); (6) it is outside the task's display period, or the task is hidden from everyone</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> c.client_id
<span class="kw">FROM</span> crm_customer_base c
<span class="kw">JOIN</span> promo_client_group a <span class="kw">ON</span> a.client_group = c.group_code
  <span class="kw">AND</span> a.promo_table = <span class="str">'point_program'</span>
  <span class="kw">AND</span> a.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_program b <span class="kw">ON</span> b.id = a.promo_config_id
  <span class="kw">AND</span> b.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_task_bundle tb <span class="kw">ON</span> tb.program_id = b.id
  <span class="kw">AND</span> tb.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_task_trading d <span class="kw">ON</span> d.task_bundle_id = tb.id
  <span class="kw">AND</span> d.enabled = <span class="num">1</span>
<span class="kw">WHERE</span> b.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> tb.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> d.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> (d.display_event = <span class="str">'signup'</span> <span class="kw">OR</span> (d.display_event = <span class="str">'kyc_approve'</span> <span class="kw">AND</span> c.kyc_approve_time &gt; <span class="num">0</span>) <span class="kw">OR</span> (d.display_event = <span class="str">'first_time_deposit'</span> <span class="kw">AND</span> c.first_deposit_time &gt; <span class="num">0</span>) <span class="kw">OR</span> (d.display_event = <span class="str">'first_trade'</span> <span class="kw">AND</span> c.first_real_trade_time &gt; <span class="num">0</span>))
  <span class="kw">AND</span> (d.display_period_limit_apply = <span class="num">0</span> <span class="kw">OR</span> (<span class="fn">NOW</span>() &gt;= d.display_period_from <span class="kw">AND</span> <span class="fn">NOW</span>() &lt; d.display_period_to))
  <span class="kw">AND</span> (d.display_hide_to_all = <span class="num">0</span> <span class="kw">OR</span> <span class="kw">EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> point_task_trading_log l <span class="kw">WHERE</span> l.task_id = d.id <span class="kw">AND</span> l.client_id = c.client_id))
  <span class="kw">AND</span> <span class="kw">NOT</span> <span class="kw">EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> client_promotion_blacklist bl <span class="kw">WHERE</span> bl.enabled = <span class="num">1</span> <span class="kw">AND</span> bl.promo_table = <span class="str">'point_program'</span> <span class="kw">AND</span> bl.client_id = c.client_id <span class="kw">AND</span> bl.promo_config_id = d.program_id <span class="kw">AND</span> (bl.point_task_bundle_id <span class="kw">IS</span> <span class="kw">NULL</span> <span class="kw">OR</span> bl.point_task_bundle_id = d.task_bundle_id))</code></td><td>This is exactly the condition of the PointTaskTradingMapper.getAppTradingTaskConfig function that the app uses to display the trading task. The backend should call this same function (with result = ELIGIBLE) instead of writing a new query, so that notifications and the app do not diverge. Customers who have not been assigned a book type are handled as in the current code</td></tr><tr id="def-BALANCE"><td><code>BALANCE</code></td><td>The customer's usable coin balance (not yet expired)</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="fn">SUM</span>(point_balance),<span class="num">0</span>)
<span class="kw">FROM</span> point_lot
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> point_expiration_time &gt; <span class="fn">NOW</span>()</code></td><td>Must equal exactly the balance that the coin overview API returns to the app</td></tr><tr id="def-LIFETIME"><td><code>LIFETIME</code></td><td>Total coin the customer has ever received to date</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="fn">SUM</span>(point_amount),<span class="num">0</span>) <span class="kw">FROM</span> point_ledger <span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span> <span class="kw">AND</span> type = <span class="num">1</span></code></td><td></td></tr><tr id="def-TODAY_KEY"><td><code>TODAY_KEY</code></td><td>The current date in the task's time zone (GMT+7), in the same format as the period_key column</td><td class="q"><code class="sql"><span class="fn">DATE_FORMAT</span>(<span class="fn">UTC_TIMESTAMP</span>() + <span class="kw">INTERVAL</span> <span class="num">420</span> <span class="kw">MINUTE</span>, <span class="str">'%Y-%m-%d'</span>)</code></td><td>420 comes from point_task_trading.tz_minutes; format it exactly like the actual period_key</td></tr><tr id="def-PREV_TRADING_DAY"><td><code>PREV_TRADING_DAY</code></td><td>The business day immediately before TODAY_KEY. On Monday, use Friday</td><td class="q">Computed by calendar: go back 1 day; if that falls on Saturday or Sunday, keep going back to Friday</td><td></td></tr><tr id="def-TRADED_TODAY"><td><code>TRADED_TODAY</code></td><td>Today (in GMT+7) the customer has had at least one buy or sell deal on MT5, on any real account. Both position-opening and position-closing deals count</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="num">1</span>
<span class="kw">FROM</span> mt5_deals d
<span class="kw">JOIN</span> bo_client_logins l <span class="kw">ON</span> l.login_id = d.Login
<span class="kw">WHERE</span> l.client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> l.real_login = <span class="num">1</span>
  <span class="kw">AND</span> d.Action <span class="kw">IN</span> (<span class="num">0</span>,<span class="num">1</span>)
  <span class="kw">AND</span> d.Time &gt;= <span class="prm">:today_start_mt5_time</span>
<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td>Action 0 = buy, 1 = sell; do not filter by Entry, so that both opens and closes are included. Convert the 00:00 GMT+7 boundary to MT5 server time in exactly the way the point calculation engine does. Do not use point_task_trading_deal_log, because that table only contains position-closing deals</td></tr><tr id="def-NEXT_GIFT"><td><code>NEXT_GIFT</code></td><td>The cheapest target gift priced above the current balance. Empty when the balance already exceeds the most expensive gift</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> gift_short_name, point_price
<span class="kw">FROM</span> point_notify_gift_target
<span class="kw">WHERE</span> enabled = <span class="num">1</span>
  <span class="kw">AND</span> point_price &gt; <span class="prm">:balance</span>
<span class="kw">ORDER BY</span> point_price <span class="kw">ASC</span>
<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td>New table to create: point_notify_gift_target (id, gift_name, gift_short_name, point_price, enabled). The gift list is entered manually, with 5–6 gifts expected, so that the gift name in the daily messages changes frequently</td></tr><tr id="def-REACHABLE_GIFT"><td><code>REACHABLE_GIFT</code></td><td>The most expensive target gift that the current balance is enough to redeem. Empty when the balance is not enough for any gift</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> gift_short_name, point_price
<span class="kw">FROM</span> point_notify_gift_target
<span class="kw">WHERE</span> enabled = <span class="num">1</span>
  <span class="kw">AND</span> point_price &lt;= <span class="prm">:balance</span>
<span class="kw">ORDER BY</span> point_price <span class="kw">DESC</span>
<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td></td></tr><tr id="def-COIN_PER_LOT"><td><code>COIN_PER_LOT</code></td><td>The highest coin per lot the customer can receive across their real accounts</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="fn">MAX</span>(pc.point_per_lot)
<span class="kw">FROM</span> bo_client_logins l
<span class="kw">JOIN</span> point_task_trading_point_conversion pc <span class="kw">ON</span> pc.mt5_group = l.group_name
  <span class="kw">AND</span> pc.deleted = <span class="num">0</span>
<span class="kw">JOIN</span> point_task_trading t <span class="kw">ON</span> t.id = pc.task_id
  <span class="kw">AND</span> t.enabled = <span class="num">1</span>
<span class="kw">WHERE</span> l.client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> l.real_login = <span class="num">1</span></code></td><td>The backend sends only the number; the word 'hingga' (up to) is in the copy template on CleverTap</td></tr>
</table></div>

<h2>4. Detailed content plan</h2>
<p>The copy is a draft in Indonesian. Text in curly braces, for example <code>{coin_balance}</code>, is a variable (macro) taken from the properties of the trigger event; A1 and A2 alone take theirs from user properties. When built on CleverTap, variables are written in CleverTap's syntax.</p>

<h3>Overview of the 14 messages</h3>
<p>Limiting the number of sends is split between two places, and the table below records each one separately:</p>
<ul>
  <li><b>Backend limit</b> works by not firing the event: when the customer does not meet the conditions, or has already received that event, CleverTap receives nothing to send.</li>
  <li><b>CleverTap limit</b> works through each campaign's settings: the event still arrives, but the campaign sends at most the configured number of times per customer.</li>
  <li><b>Global limit</b> is also set in CleverTap: each customer gets at most 2 pushes per day and 6 pushes per week, counted across all messages marked "Counts toward the global limit". <span class="pending">PENDING</span> It is not yet confirmed whether the CleverTap account supports the global limit and per-campaign limits; if not, the limits in the CleverTap column must move to the backend.</li>
</ul>

</tr><tr><td class="k">Push: body</td><td><span class="idn"><code>{coin_spent}</code> Coin ditukar. Sisa saldo: <code>{coin_balance}</code> Coin. Voucher akan dikirim ke email kamu.</span></td></tr><tr><td class="k">Meaning (English)</td><td>Coin redeemed successfully. X Coin redeemed. Your remaining balance is Y Coin. The voucher will be sent to your email.</td></tr><tr><td class="k">Macro</td><td>coin_spent, coin_balance</td></tr><tr><td class="k">Opens on tap</td><td>Coin history (proposed) <span class="pending">PENDING</span></td></tr><tr><td class="k">Notes</td><td>This message is sent by HSB through CleverTap and only confirms the coin (how much was deducted, how much remains). The voucher email is sent by TADA from TADA's own system, outside CleverTap, so M12 has no Email. The customer-facing copy does not name TADA or mention the partner. PENDING: the event depends on the TADA module, not available as of 2026-10-10</td></tr></table><h4 id="msg-M13">M13. Coin refund</h4><table class="msg"><tr><td class="k">Channel</td><td>Push + Email</td></tr><tr><td class="k">Trigger</td><td><code>coin_refunded</code><br>Event backend</td></tr><tr><td class="k">Filter in CleverTap</td><td><div>No additional filter</div></td></tr><tr><td class="k">Backend limit</td><td>1 event per coin refund</td></tr><tr><td class="k">CleverTap limit</td><td>No additional limit. Outside the global limit</td></tr><tr><td class="k">Push: title</td><td><span class="idn">Coin dikembalikan</span></td></tr><tr><td class="k">Push: body</td><td><span class="idn"><code>{coin_refunded}</code> Coin sudah kembali ke saldo kamu. Saldo sekarang: <code>{coin_balance}</code> Coin.</span></td></tr><tr><td class="k">Email: subject</td><td><span class="idn"><code>{coin_refunded}</code> Coin sudah dikembalikan ke saldo kamu</span></td></tr><tr><td class="k">Email preview</td><td><button type="button" class="pv" data-mail="M13" data-title="M13. Coin refund">View email preview</button><div class="pv-note">Layout: Brand bar → large heading → stats row → paragraph → button → email footer</div></td></tr><tr><td class="k">Meaning (English)</td><td>Coin refunded. X Coin has been returned to your balance. Your current balance is Y Coin.</td></tr><tr><td class="k">Macro</td><td>coin_refunded, coin_balance</td></tr><tr><td class="k">Opens on tap</td><td>Coin history (proposed) <span class="pending">PENDING</span></td></tr><tr><td class="k">Notes</td><td>This message is sent by HSB through CleverTap and only confirms the refunded coin. It does not state the reason for the refund because HSB does not know the reason. PENDING: the event depends on the TADA module, not available as of 2026-10-10</td></tr></table><div class="mailsrc" id="mail-M1" hidden><table class="em-meta"><tr><td>Email subject</td><td><span class="l-id">Trading kamu sekarang bisa menghasilkan Coin</span><span class="l-vi">Your trades can now earn Coin</span></td></tr><tr><td>Preheader</td><td><span class="l-id">Kenalan dengan HSB Loyalty: trading, kumpulkan Coin, tukar dengan hadiah.</span><span class="l-vi">Get to know HSB Loyalty: trade, collect Coin, redeem gifts.</span></td></tr></table><div class="em"><div class="em-head">HSB Loyalty</div><div class="em-body"><div class="em-hero"><div class="em-title"><span class="l-id">Perkenalkan, HSB Loyalty 🎁</span><span class="l-vi">Introducing HSB Loyalty 🎁</span></div><div class="em-sub"><span class="l-id">Program hadiah baru untuk trader HSB</span><span class="l-vi">A new rewards program for HSB traders</span></div></div><p class="em-p"><span class="l-id">Mulai hari ini, trading kamu di HSB bisa menghasilkan Coin secara otomatis. Kumpulkan Coin dan tukar dengan hadiah pilihanmu.</span><span class="l-vi">Starting today, your trades at HSB can automatically earn Coin. Collect Coin and redeem it for the gift of your choice.</span></p><div class="em-steps"><div class="em-step"><div class="em-num">1</div><div><div class="em-st"><span class="l-id">Trading seperti biasa</span><span class="l-vi">Trade as usual</span></div><div class="em-sd"><span class="l-id">Coin masuk otomatis saat kamu menutup posisi yang memenuhi syarat. Tidak perlu mendaftar.</span><span class="l-vi">Coin comes in automatically when you close an eligible position. No sign-up needed.</span></div></div></div><div class="em-step"><div class="em-num">2</div><div><div class="em-st"><span class="l-id">Kumpulkan Coin</span><span class="l-vi">Collect Coin</span></div><div class="em-sd"><span class="l-id">Kamu bisa mendapat 70–100 Coin per lot, tergantung jenis akun dan instrumen.</span><span class="l-vi">You can get 70–100 Coin per lot, depending on your account type and the product you trade.</span></div></div></div><div class="em-step"><div class="em-num">3</div><div><div class="em-st"><span class="l-id">Tukar dengan hadiah</span><span class="l-vi">Redeem for gifts</span></div><div class="em-sd"><span class="l-id">Pilih hadiah di halaman HSB Loyalty. Voucher akan dikirim ke email kamu.</span><span class="l-vi">Choose a gift on the HSB Loyalty page. The voucher will be sent to your email.</span></div></div></div></div><div class="em-cta"><span class="em-btn"><span class="l-id">Lihat HSB Loyalty</span><span class="l-vi">View HSB Loyalty</span></span></div><div class="em-rules"><div class="em-rt"><span class="l-id">Yang perlu kamu tahu</span><span class="l-vi">What you need to know</span></div><ul><li><span class="l-id">Coin hanya dihitung untuk posisi yang ditahan minimal 3 menit.</span><span class="l-vi">Coin is only counted for positions held for at least 3 minutes.</span></li><li><span class="l-id">Maksimal 2.000 Coin per hari (WIB); kelebihannya tidak dihitung.</span><span class="l-vi">At most 2,000 Coin per day (WIB time); anything above that is not counted.</span></li><li><span class="l-id">Coin berlaku 180 hari sejak diterima.</span><span class="l-vi">Coin is valid for 180 days from the time you receive it.</span></li></ul></div></div><div class="em-foot"><div><span class="l-id">Kamu menerima email ini karena terdaftar di program HSB Loyalty.</span><span class="l-vi">You are receiving this email because you have joined the HSB Loyalty program.</span></div><div><span class="l-id">Berhenti berlangganan</span><span class="l-vi">Unsubscribe from emails</span></div></div></div></div><div class="mailsrc" id="mail-M2" hidden><table class="em-meta"><tr><td>Email subject</td><td><span class="l-id">Selamat datang di HSB Loyalty</span><span class="l-vi">Welcome to HSB Loyalty</span></td></tr><tr><td>Preheader</td><td><span class="l-id">Akun kamu sudah bisa mengumpulkan Coin dari trading.</span><span class="l-vi">Your account can now earn Coin from trading.</span></td></tr></table><div class="em"><div class="em-head">HSB Loyalty</div><div class="em-body"><div class="em-hero"><div class="em-title"><span class="l-id">Akun kamu sudah bisa kumpulkan Coin</span><span class="l-vi">Your account can now earn Coin</span></div><div class="em-sub"><span class="l-id">Selamat bergabung di HSB Loyalty</span><span class="l-vi">Welcome to HSB Loyalty</span></div></div><p class="em-p"><span class="l-id">Mulai sekarang, trading kamu bisa menghasilkan hingga <span class="mc" data-m="{coin_per_lot}" data-s="80">80</span> Coin per lot. Coin bisa ditukar dengan hadiah.</span><span class="l-vi">From now on, your trades can earn up to <span class="mc" data-m="{coin_per_lot}" data-s="80">80</span> Coin per lot. Coin can be redeemed for gifts.</span></p><div class="em-steps"><div class="em-step"><div class="em-num">1</div><div><div class="em-st"><span class="l-id">Trading seperti biasa</span><span class="l-vi">Trade as usual</span></div><div class="em-sd"><span class="l-id">Coin masuk otomatis saat kamu menutup posisi yang memenuhi syarat. Tidak perlu mendaftar.</span><span class="l-vi">Coin comes in automatically when you close an eligible position. No sign-up needed.</span></div></div></div><div class="em-step"><div class="em-num">2</div><div><div class="em-st"><span class="l-id">Kumpulkan Coin</span><span class="l-vi">Collect Coin</span></div><div class="em-sd"><span class="l-id">Kamu bisa mendapat 70–100 Coin per lot, tergantung jenis akun dan instrumen.</span><span class="l-vi">You can get 70–100 Coin per lot, depending on your account type and the product you trade.</span></div></div></div><div class="em-step"><div class="em-num">3</div><div><div class="em-st"><span class="l-id">Tukar dengan hadiah</span><span class="l-vi">Redeem for gifts</span></div><div class="em-sd"><span class="l-id">Pilih hadiah di halaman HSB Loyalty. Voucher akan dikirim ke email kamu.</span><span class="l-vi">Choose a gift on the HSB Loyalty page. The voucher will be sent to your email.</span></div></div></div></div><div class="em-cta"><span class="em-btn"><span class="l-id">Lihat HSB Loyalty</span><span class="l-vi">View HSB Loyalty</span></span></div><div class="em-rules"><div class="em-rt"><span class="l-id">Yang perlu kamu tahu</span><span class="l-vi">What you need to know</span></div><ul><li><span class="l-id">Coin hanya dihitung untuk posisi yang ditahan minimal 3 menit.</span><span class="l-vi">Coin is only counted for positions held for at least 3 minutes.</span></li><li><span class="l-id">Maksimal 2.000 Coin per hari (WIB); kelebihannya tidak dihitung.</span><span class="l-vi">At most 2,000 Coin per day (WIB time); anything above that is not counted.</span></li><li><span class="l-id">Coin berlaku 180 hari sejak diterima.</span><span class="l-vi">Coin is valid for 180 days from the time you receive it.</span></li></ul></div></div><div class="em-foot"><div><span class="l-id">Kamu menerima email ini karena terdaftar di program HSB Loyalty.</span><span class="l-vi">You are receiving this email because you have joined the HSB Loyalty program.</span></div><div><span class="l-id">Berhenti berlangganan</span><span class="l-vi">Unsubscribe from emails</span></div></div></div></div><div class="mailsrc" id="mail-A1" hidden><table class="em-meta" ly: When next_gift_name is empty (the balance already exceeds the most expensive gift)</div><p class="em-p"><span class="l-id">Coin kamu sudah cukup untuk ditukar dengan hadiah. Pilih hadiahmu sekarang.</span><span class="l-vi">Your Coin is enough to redeem a gift. Choose your gift now.</span></p></div><div class="em-cta"><span class="em-btn"><span class="l-id">Lihat hadiah</span><span class="l-vi">View gifts</span></span></div><p class="em-note"><span class="l-id">Coin berlaku 180 hari sejak diterima.</span><span class="l-vi">Coin is valid for 180 days from the time you receive it.</span></p><p class="em-note"><span class="l-id">Harga dan ketersediaan hadiah mengikuti halaman hadiah.</span><span class="l-vi">Gift prices and availability are as shown on the gift page.</span></p></div><div class="em-foot"><div><span class="l-id">Kamu menerima email ini karena terdaftar di program HSB Loyalty.</span><span class="l-vi">You are receiving this email because you have joined the HSB Loyalty program.</span></div><div><span class="l-id">Berhenti berlangganan</span><span class="l-vi">Unsubscribe from emails</span></div></div></div></div><div class="mailsrc" id="mail-A2" hidden><table class="em-meta"><tr><td>Email subject</td><td><span class="l-id">Kenapa trading kamu belum menghasilkan Coin?</span><span class="l-vi">Why haven't your trades earned Coin yet?</span></td></tr><tr><td>Preheader</td><td><span class="l-id">Coin hanya dihitung untuk posisi yang ditahan minimal 3 menit.</span><span class="l-vi">Coin is only counted for positions held for at least 3 minutes.</span></td></tr></table><div class="em"><div class="em-head">HSB Loyalty</div><div class="em-body"><div class="em-hero"><div class="em-title"><span class="l-id">Trading kamu bisa menghasilkan Coin</span><span class="l-vi">Your trades can earn Coin</span></div></div><p class="em-p"><span class="l-id">Kamu sudah trading di HSB, tapi belum ada Coin yang masuk. Berikut syarat agar trading menghasilkan Coin.</span><span <h1>HSB Loyalty Program – CleverTap 通知计划</h1>
<p class="sub">HSB Loyalty 活动计划的 Push 和 Email。更新日期：2026-10-12。</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="flow" aria-selected="false">1. 消息流程</button><button type="button" role="tab" data-tab="backend" aria-selected="false">2. Backend</button><button type="button" role="tab" data-tab="frontend" aria-selected="false">3. Frontend</button><button type="button" role="tab" data-tab="content" aria-selected="false">4. Content plan</button></nav>
<section class="panel" id="flow" role="tabpanel">
<h2>1. 消息流程</h2>
<p>HSB Loyalty Program 让客户在交易时获得 Coin，并通过合作方 TADA 用 Coin 兑换礼品。本文档说明活动计划上线时通过 CleverTap 发送的 Push 和 Email 消息：发什么消息、发给谁、何时发，以及后端、前端需要做什么才能发送。全套共 14 条消息，使用 9 个来自后端的 event 和 1 个来自 App 的 event。</p>

<h3>总体方向</h3>
<ul>
  <li><b>主要目标是让客户交易更多。</b> 所有促进交易的消息都换算成礼品：“还差 X Coin 即可兑换 [礼品]”，而不是抽象的 Coin 里程碑。</li>
  <li><b>后端负责判断条件，CleverTap 负责文案和频率。</b> 后端决定哪位客户收到哪个 event，并附带完整的变量。CleverTap 拼接内容，并应用各 campaign 的发送次数限制。</li>
  <li><b>两类 event。</b> 交易类 event 在事情发生时立即发送（符合条件、首个 Coin、兑换礼品、退还 Coin）。定时类 event 由定时任务按时运行，判断每位客户的当前状态后分批发送。</li>
  <li><b>每位客户每天最多 2 条定时 Push。</b> 客户已在 10:00 收到礼品消息的，14:00 的定时任务会跳过。</li>
  <li><b>不能参加活动计划的客户不会收到消息。</b> 详见下方“客户何时不会收到消息”一节。</li>
  <li><b>印度尼西亚市场。</b> 内容为印尼语，发送时间按 WIB (GMT+7)，客户以 <code>client_id</code> 作为标识。</li>
</ul>

<h3>客户何时不会收到消息</h3>
<p>通知使用的条件与 App 当前向客户展示 trading task 所用的条件完全一致（<a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> 的定义见 Backend 标签页）。客户属于以下任一情况时，视为不参加活动计划：</p>
<table>
  <tr><th style="width:34%">情况</th><th>在哪里检查</th></tr>
