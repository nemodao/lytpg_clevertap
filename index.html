<h3>图 1：客户旅程及对应消息</h3>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">1. 符合条件</div><div class="fd">客户首次入金 (FTD)，且属于可参加活动计划的客户组。</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M1" class="ref">M1</a></td><td class="n">活动计划上线</td><td>通知活动计划已上线。在 launch 当天向所有当前符合条件的客户发送一次。</td></tr><tr><td class="c"><a href="#msg-M2" class="ref">M2</a></td><td class="n">欢迎新客户</td><td>面向 launch 日之后才符合条件的客户。在客户首次入金几小时后发送，告知账户已开始累积 Coin。</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">2. 尚无 Coin</div><div class="fd">客户已入金，但尚未获得任何 Coin。</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T0" class="ref">T0</a></td><td class="n">提醒获取首个 Coin</td><td>周一至周五 14:00 发送，条件是客户当天尚未交易。仅在首次入金后的 14 天内发送，最多 3 次，之后完全停止。</td></tr><tr><td class="c"><a href="#msg-A2" class="ref">A2</a></td><td class="n">说明获得 Coin 的条件</td><td>发给已交易但余额仍为 0、且从未打开过活动计划页面的客户的 Email。说明持仓必须至少保持 3 分钟才会计入 Coin。</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">3. 首个 Coin</div><div class="fd">客户有生以来第一次获得 Coin。</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M4" class="ref">M4</a></td><td class="n">祝贺获得首个 Coin</td><td>客户首次获得 Coin 时立即发送，并提醒 Coin 可用于兑换礼品。</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">4. 每日累积</div><div class="fd">客户交易，Coin 余额逐步增加。这是客户停留最久的阶段，也是整套消息的重点。</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T5" class="ref">T5</a></td><td class="n">按最近一次交易提醒</td><td>14:00（周一至周五）发送给今天尚未交易、但上一个工作日获得过 Coin 的客户。提醒上一次获得的 Coin 数量，以及兑换下一件礼品还差多少 Coin。每周最多 2 次。</td></tr><tr><td class="c"><a href="#msg-T1" class="ref">T1</a></td><td class="n">今天尚未交易</td><td>14:00（周一至周五）发送给今天尚未交易、上一个工作日也没有 Coin、但以前曾获得过 Coin 的客户。号召今天交易，说明每 lot 的 Coin 数量以及兑换礼品还差多少 Coin。每周最多 1 次；客户连续 14 天没有 Coin 时停止。</td></tr><tr><td class="c"><a href="#msg-T4" class="ref">T4</a></td><td class="n">今日总结</td><td>19:30（周一至周五）发送给当天已获得 Coin 的客户。告知今天获得多少 Coin、兑换下一件礼品还差多少，并邀请在晚间时段继续交易。每周最多 3 次。</td></tr><tr><td class="c"><a href="#msg-T7" class="ref">T7</a></td><td class="n">每周总结</td><td>周六上午发给本周获得过 Coin 的客户的 Email。包含本周 Coin 数量、有交易的天数、当前余额，以及 3 件礼品的列表和到每件礼品的进度百分比。</td></tr><tr><td class="c"><a href="#msg-A1" class="ref">A1</a></td><td class="n">有 Coin 但尚未查看页面</td><td>面向已有 100 Coin 以上、但从未在 App 中打开过活动计划页面的客户。告知当前 Coin 数量和可兑换的礼品。在客户符合条件后的第 3 天和第 10 天发送。</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">5. 接近礼品</div><div class="fd">Coin 余额接近或达到某件目标礼品的价格。</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T6" class="ref">T6</a></td><td class="n">即将可兑换礼品</td><td>余额首次达到下一件礼品价格的 70% 时发送。每位客户一生只收到一次。</td></tr><tr><td class="c"><a href="#msg-M10" class="ref">M10</a></td><td class="n">已可兑换礼品</td><td>余额首次足够兑换一件礼品时发送。每位客户一生只收到一次。</td></tr></table><div class="fnote" id="note-gift"><b>注意：这是专为 launch phase 1 设计的方案。</b> 这两条接近礼品的提醒消息，是在我们对 TADA 系统了解还有限时设计的。因此每条消息对每位客户只发送 <b>一生一次</b>，以避免 spam。与 TADA 完成集成并充分了解系统后，这部分可以去掉，换成一套更有吸引力的领取礼品、领取奖励通知。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">6. 兑换礼品</div><div class="fd">客户在 TADA 的 webview 中用 Coin 兑换礼品。此阶段有两方同时向客户发送消息。</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M12" class="ref">M12</a></td><td class="n">兑换礼品成功</td><td>由 HSB 通过 CleverTap 发送，Coin 被扣除时立即发送。仅确认 Coin：已兑换多少 Coin 以及剩余余额。此消息不包含 voucher。</td></tr><tr><td class="c"><a href="#msg-M13" class="ref">M13</a></td><td class="n">退还 Coin</td><td>由 HSB 通过 CleverTap 发送，某次兑换礼品的 Coin 被退还时立即发送。仅确认退还的 Coin 数量和新余额。</td></tr></table><div class="fnote" id="note-tada"><b>兑换礼品流程中谁发什么：</b><table class="inner"><tr><th>发送方</th><th>发送内容</th><th>渠道</th><th>是否在本文档范围内</th></tr><tr><td>TADA</td><td>礼品的 voucher：礼品码和使用说明</td><td>来自 TADA 系统的 Email</td><td>否。HSB 不撰写也不控制该内容</td></tr><tr><td>HSB（通过 CleverTap）</td><td>Coin 确认：Coin 被扣除时发 M12，Coin 被退还时发 M13</td><td>M12：Push。M13：Push 和 Email</td><td>是</td></tr></table>M12 没有 Email，以免客户因一次兑换礼品同时收到两封邮件。</div></div></div>
<p class="note">兑换礼品后，客户回到阶段 4 继续累积。点击消息编码可查看详细文案。</p>

<h3>图 2：定时任务的一天</h3>
<p>以下三个定时任务在一天内依次运行。在每个定时任务中，后端按从上到下的顺序判断条件，并在第一个匹配的条件处停止。</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">10:00 WIB，每天（含周末）</div><div class="fd"><b>礼品任务</b></div><div class="fd">每天上午，后端将每位客户的 Coin 余额与目标礼品列表进行比较，以便在客户第一次即将足够或已经足够 Coin 兑换某件礼品时通知客户。每位客户每类消息一生只收到一次；原因见图 1 中 <a href="#note-gift" class="ref">阶段“5. 接近礼品”的注意事项</a>。<br><br>目标礼品列表在 HSB 侧配置：复制我们已在 TADA 上配置的若干有吸引力礼品的信息，Coin 数量相同。详见 Backend 标签页中的 <a href="#tbl-point_notify_gift_target" class="ref">point_notify_gift_target</a> 表。</div></div><table class="fmsg"><tr><th class="c">判断顺序</th><th>条件</th><th class="r">结果</th></tr><tr><td class="c">1</td><td>余额已足够兑换至少一件礼品，且客户从未收到过“已可兑换礼品”消息</td><td class="r">针对客户 Coin 足够兑换的最贵礼品发送 <a href="#msg-M10" class="ref">M10</a></td></tr><tr><td class="c">2</td><td>不属于上述情况；余额达到下一件礼品价格的 70% 及以上，且客户从未收到过“即将可兑换礼品”消息</td><td class="r">针对该礼品发送 <a href="#msg-T6" class="ref">T6</a></td></tr><tr><td class="c">3</td><td>其余情况</td><td class="r">不发送</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">14:00 WIB，周一至周五</div><div class="fd"><b>午后提醒</b></div><div class="fd">午后，后端找出今天尚未交易的客户，提醒他们进行交易。提醒内容因客户的历史而不同，每位客户最多收到一条消息。</div></div><table class="fmsg"><tr><th class="c">判断顺序</th><th>条件</th><th class="r">结果</th></tr><tr><td class="c">1</td><td>客户今天 10:00 已收到礼品消息</td><td class="r">不发送，以避免同一时段内出现两条消息</td></tr><tr><td class="c">2</td><td>客户今天在 MT5 上已有至少一笔开仓或平仓</td><td class="r">不发送，因为客户已交易</td></tr><tr><td class="c">3</td><td>客户从未获得过 Coin，且仍在首次入金后的 14 天内</td><td class="r">发送 <a href="#msg-T0" class="ref">T0</a></td></tr><tr><td class="c">4</td><td>客户曾获得过 Coin，且上一个工作日获得过 Coin（未达到当天的每日上限）</td><td class="r">发送 <a href="#msg-T5" class="ref">T5</a></td></tr><tr><td class="c">5</td><td>客户曾获得过 Coin，上一个工作日没有 Coin，且最近一次获得 Coin 未超过 14 天</td><td class="r">发送 <a href="#msg-T1" class="ref">T1</a></td></tr><tr><td class="c">6</td><td>其余情况，例如首次入金后已超过 14 天仍没有 Coin，或已超过 14 天未获得 Coin</td><td class="r">不发送</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">19:30 WIB，周一至周五</div><div class="fd"><b>每日总结</b></div><div class="fd">晚间、美盘时段之前，后端向当天已获得 Coin 的客户发送总结：今天获得多少 Coin，以及兑换下一件礼品还差多少。</div></div><table class="fmsg"><tr><th class="c">判断顺序</th><th>条件</th><th class="r">结果</th></tr><tr><td class="c">1</td><td>客户今天获得过 Coin，包括已达到当天 Coin 每日上限的情况</td><td class="r">发送 <a href="#msg-T4" class="ref">T4</a></td></tr><tr><td class="c">2</td><td>客户今天没有获得 Coin</td><td class="r">不发送</td></tr></table></div></div>
<p class="note">除上述三个定时任务外：每周总结 Email（<a href="#msg-T7" class="ref">T7</a>）在周六上午 09:00 WIB 发送；消息 <a href="#msg-M2" class="ref">M2</a>、<a href="#msg-M4" class="ref">M4</a>、<a href="#msg-M12" class="ref">M12</a>、<a href="#msg-M13" class="ref">M13</a> 在事情发生时立即发送；<a href="#msg-A1" class="ref">A1</a> 和 <a href="#msg-A2" class="ref">A2</a> 是在 CleverTap 中设置定时的 campaign。</p>

<h2>2. 后端的工作</h2>
<p>后端需要新建 2 张表、向 CleverTap 发送 9 个 event，并更新 6 个 user property。event 名称和属性采用 <code>snake_case</code> 写法。各条 query 按现有表结构编写，尚未在 DB 上试运行。</p>

<h3>2.1 新表</h3>
<h4 id="tbl-point_notify_gift_target"><code>point_notify_gift_target</code></h4><p>由 HSB 自行配置的目标礼品列表，用于计算消息中的“下一件礼品”和“还差多少 Coin”。每一行复制 HSB 已在 TADA 上配置的一件有吸引力礼品的信息，Coin 数量相同。手工录入，不从 TADA 自动同步，因此在 TADA 上更换礼品或调整价格时，必须同步修改此表。预计 5–6 行</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:15%">类型</th><th style="width:8%">必填</th><th style="width:19%">示例</th><th>含义</th></tr><tr><td><code>id</code></td><td>bigint，自增</td><td>是</td><td>1</td><td>主键</td></tr><tr><td><code>program_id</code></td><td>bigint</td><td>是</td><td>1001</td><td>适用的活动计划，指向 point_program.id</td></tr><tr><td><code>gift_name</code></td><td>varchar(128)</td><td>是</td><td>Saldo GoPay Rp50.000</td><td>礼品的完整名称，用于 Email</td></tr><tr><td><code>gift_short_name</code></td><td>varchar(32)</td><td>是</td><td>GoPay Rp50.000</td><td>用于 Push 的简称。建议保持在 25 个字符以内，以免 Push 标题被截断</td></tr><tr><td><code>point_price</code></td><td>bigint</td><td>是</td><td>500</td><td>礼品的 Coin 价格，必须与 TADA 上当前配置的价格完全一致。同一活动计划中两件启用的礼品不得价格相同</td></tr><tr><td><code>gift_image_url</code></td><td>varchar(512)</td><td>否</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>礼品图片的链接，随 event 发送到 CleverTap，用于在 Email 中显示。必须是公开的 https 链接，无需登录，并放在 HSB 的图片服务器上，以保证链接不变。留空则 Email 不显示图片</td></tr><tr><td><code>enabled</code></td><td>tinyint</td><td>是</td><td>1</td><td>1 = 启用，0 = 关闭。所有行都关闭时，消息将不再提及礼品</td></tr><tr><td><code>remark</code></td><td>varchar(255)</td><td>否</td><td>2026-11-01 与 TADA 核对</td><td>自由备注，例如最近一次与 TADA 核对价格的日期</td></tr><tr><td><code>create_date, create_user, update_date, update_user</code></td><td>与其他 point_ 表相同</td><td>是</td><td></td><td>创建和修改信息</td></tr></table></div><h4 id="tbl-point_notify_log"><code>point_notify_log</code></h4><p>记录后端已发送到 CleverTap 的每个 event，用于防止重复发送和检查限制（一生 1 次、每天 1 次、每周 1 次）</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:15%">类型</th><th style="width:8%">必填</th><th style="width:19%">示例</th><th>含义</th></tr><tr><td><code>id</code></td><td>bigint，自增</td><td>是</td><td>1</td><td>主键</td></tr><tr><td><code>client_id</code></td><td>bigint</td><td>是</td><td>7200123</td><td>接收 event 的客户</td></tr><tr><td><code>event_name</code></td><td>varchar(64)</td><td>是</td><td>first_gift_reachable</td><td>已发送的 event 名称</td></tr><tr><td><code>ref_key</code></td><td>varchar(64)</td><td>是</td><td>2026-11-03</td><td>按 event 类型区分的去重键：一生一次的 event 使用 'lifetime'；按天的 event 使用 GMT+7 日期；按周的 event 使用该周周六的日期；coin_redeemed 和 coin_refunded 使用 redemption_id</td></tr><tr><td><code>payload</code></td><td>json</td><td>否</td><td>{"gift_name":"GoPay Rp50.000"}</td><td>随 event 发送的属性，用于客户有疑问时追查</td></tr><tr><td><code>send_status</code></td><td>tinyint</td><td>是</td><td>1</td><td>1 = CleverTap 接收成功，0 = 失败</td></tr><tr><td><code>create_date</code></td><td>datetime</td><td>是</td><td></td><td>触发时间</td></tr><tr><td>（唯一键）</td><td>client_id + event_name + ref_key</td><td></td><td></td><td>在数据库层面阻止重复发送</td></tr></table></div>

<h3>2.2 Event 及 event 的属性</h3>
<p>每个 event 通过服务端 upload API 发送到 CleverTap，以 <code>client_id</code> 标识客户。示例：</p>
<pre>{
  "d": [{
    "identity": "7200123",
    "type": "event",
    "evtName": "loyalty_daily_summary",

<p>各 event 的运行时间记录在该 event 区块的“触发时间”一行；这些时间均做成配置项。</p>
<p>每次发送成功后，向 <code>point_notify_log</code> 写入一行。“计算方式”列中的大写名称（例如 <code>BALANCE</code>）是第 2.4 节中的通用定义。</p>
<p><b>数字显示约定：</b> 每个数字属性都有一个按印尼格式排版好的字符串版本，用于显示（例如 coin_balance_text）。</p>
<div class="scroll evblock" id="ev-loyalty_enrolled"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_enrolled</code><span class="evmeta">用于消息：<a href="#msg-M2" class="ref">M2</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>定义</dt><dd>客户在 launch 日之后首次变为符合参加活动计划的条件。对新客户而言，实际上就是完成首次入金的时刻；也可能是客户被移出黑名单，或活动计划对客户所在的组开启的时刻</dd><dt>触发时间</dt><dd>定时任务每 10 分钟扫描一次</dd><dt>判定方式</dt><dd class="q">取属于 <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> 且在 <code class="sql">point_notify_log</code> 中尚无 <code class="sql">event_name = <span class="str">'loyalty_enrolled'</span></code> 记录的客户</dd><dt>去重</dt><dd class="q">每位客户一生 1 次，写入 <code class="sql">point_notify_log</code></dd><dt>备注</dt><dd>launch 时间之前：为所有当前 ELIGIBLE 的客户预先写入 point_notify_log，但不发送事件（这批客户接收 M1）。需新建的表：point_notify_log (id, client_id, event_name, ref_key, create_date)</dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>计算方式</th></tr><tr><td><code>coin_per_lot</code></td><td>number</td><td>80</td><td>客户可获得的每 lot 最高 Coin</td><td class="q"><a href="#def-COIN_PER_LOT" class="ref">COIN_PER_LOT</a></td></tr><tr><td><code>enrolled_at</code></td><td>datetime</td><td>2026-11-02T09:15:00+07:00</td><td>符合条件的时间</td><td class="q">定时任务发现的时间</td></tr></table></div><div class="scroll evblock" id="ev-coin_first_earned"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">coin_first_earned</code><span class="evmeta">用于消息：<a href="#msg-M4" class="ref">M4</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>定义</dt><dd>客户有生以来第一次获得 Coin</dd><dt>触发时间</dt><dd>发放积分的定时任务写入加 Coin 记录后立即发送</dd><dt>判定方式</dt><dd class="q">新的 <code class="sql">point_ledger</code> 记录满足 <code class="sql">type = <span class="num">1</span></code> 和 <code   <span class="kw">AND</span> period_key = <span class="prm">:period_key</span></code> 达到每日上限：<code class="sql">point_max_cap_enabled = <span class="num">1</span> <span class="kw">AND</span> point_earned &gt;= point_max_cap_value</code> 最近一次有 Coin 的日期：<code class="sql blk"><span class="kw">SELECT</span> <span class="fn">MAX</span>(period_key) <span class="kw">FROM</span> point_task_trading_log <span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span> <span class="kw">AND</span> point_earned &gt; <span class="num">0</span></code></dd><dt>去重</dt><dd class="q">每位客户每天最多 1 个 event</dd><dt>备注</dt><dd>FTD 窗口的天数（14）和 T1 的停止阈值（14）是两个独立的配置。first_deposit_time 以毫秒存储</dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>计算方式</th></tr><tr><td><code>nudge_type</code></td><td>string</td><td>last_trade_earned</td><td>提醒类型：first_coin / last_trade_earned / not_traded</td><td class="q">按上方“判定方式”中的判断顺序</td></tr><tr><td><code>last_coin</code></td><td>number</td><td>140</td><td>客户在上一个工作日获得的 Coin；没有则为 0</td><td class="q"><a href="#def-PREV_TRADING_DAY" class="ref">PREV_TRADING_DAY</a> 的 <code class="sql"><span class="fn">SUM</span>(point_task_trading_log.point_earned)</code></td></tr><tr><td><code>coin_per_lot</code></td><td>number</td><td>80</td><td>客户可获得的每 lot 最高 Coin</td><td class="q"><a href="#def-COIN_PER_LOT" class="ref">COIN_PER_LOT</a></td></tr><tr><td><code>days_since_ftd</code></td><td>number</td><td>3</td><td>自首次入金起的天数</td><td class="q"><code class="sql blk"><span class="fn">FLOOR</span>((<span class="fn">UNIX_TIMESTAMP</span>() * <span class="num">1000</span> - crm_customer_base.first_deposit_time) / <span class="num">86400000</span>)</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>当前 Coin 余额</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>下一件礼品的简称；若没有价格高于余额的礼品则为空</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>兑换下一件礼品还差的 Coin 数量</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr></table></div><div class="scroll evblock" id="ev-loyalty_daily_summary"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_daily_summary</code><span class="evmeta">用于消息：<a href="#msg-T4" class="ref">T4</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>定义</dt><dd>针对当天已获得 Coin 客户的晚间总结。已达到当天 Coin 每日上限的客户仍会收到此消息</dd><dt>触发时间</dt><dd>19:30 WIB 定时任务，周一至周五</dd><dt>判定方式</dt><dd class="q">属于 <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> 且以下语句结果大于 0 的客户：<code class="sql blk"><span class="kw">SELECT</span> <span class="fn">SUM</span>(point_earned) <span class="kw">FROM</span> point_task_trading_log <span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span> <span class="kw">AND</span> period_key = <a href="#def-TODAY_KEY" class="ref">TODAY_KEY</a></code></dd><dt>去重</dt><dd class="q">每位客户每天最多 1 个 event</dd><dt>备注</dt><dd>运行时间做成配置项</dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>计算方式</th></tr><tr><td><code>today_coin</code></td><td>number</td><td>140</td><td>今天已获得的 Coin</td><td class="q"><a href="#def-TODAY_KEY" class="ref">TODAY_KEY</a> 的 <code class="sql"><span class="fn">SUM</span>(point_task_trading_log.point_earned)</code></td></tr><tr><td><code>reachable_gift_name</code></td><td>string</td><td>Saldo GoPay Rp25.000</td><td>Coin 已足够兑换的最贵礼品；若尚不足以兑换任何礼品则为空</td><td class="q"><code class="sql"><a href="#def-REACHABLE_GIFT" class="ref">REACHABLE_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>当前 Coin 余额</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>下一件礼品的简称；若没有价格高于余额的礼品则为空</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>兑换下一件礼品还差的 Coin 数量</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr></table></div><div class="scroll evblock" id="ev-first_gift_reachable"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">first_gift_reachable</code><span class="evmeta">用于消息：<a href="#msg-M10" class="ref">M10</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>定义</dt><dd>客户余额有生以来第一次足够兑换至少一件目标礼品。目的是制造第一次推动；每位客户一生只收到 1 次</dd><dt>触发时间</dt><dd>礼品任务，每天 10:00 WIB（含周末）</dd><dt>判定方式</dt><dd class="q">对每位属于 <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> 且在 <code class="sql">point_notify_log</code> 中尚无 <code class="sql">event_name = <span class="str">'first_gift_reachable'</span></code> 记录的客户：若 <a href="#def-REACHABLE_GIFT" class="ref">REACHABLE_GIFT</a> 有结果，则针对该礼品（Coin 已足够的最贵礼品）发送事件。按定时任务运行时的余额判断，无需捕捉余额刚超过阈值的时刻</dd><dt>去重</dt><dd class="q">每位客户一生 1 次，写入 <code class="sql">point_notify_log</code></dd><dt>备注</dt><dd>礼品任务先判断 first_gift_reachable，不满足时才判断 first_gift_almost_reached；每位客户每次运行最多 1 个礼品 event。礼品任务有关闭开关。名称带 first_ 前缀，以便日后可增加频率更高的其他礼品 event 而不重名</dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>计算方式</th></tr><tr><td><code>gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>礼品的简称</td><td class="q"><code class="sql">point_notify_gift_target.gift_short_name</code></td></tr><tr><td><code>gift_price</code></td><td>number</td><td>500</td><td>礼品的 Coin 价格</td><td class="q"><code class="sql">point_notify_gift_target.point_price</code></td></tr><tr><td><code>gift_image_url</code></td><td>string</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>礼品图片链接，用于 Email；未配置则为空</td><td class="q"><code class="sql">point_notify_gift_target.gift_image_url</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>410</td><td>当前 Coin 余额</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr></table></div><div class="scroll evblock" id="ev-first_gift_almost_reached"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">first_gift_almost_reached</code><span class="evmeta">用于消息：<a href="#msg-T6" class="ref">T6</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>定义</dt><dd>客户余额有生以来第一次达到下一件礼品价格的 70% 及以上，但尚不足以兑换该礼品。每位客户一生只收到 1 次</dd><dt>触发时间</dt><dd>礼品任务，每天 10:00 WIB（含周末）（与 first_gift_reachable 同一个定时任务）</dd><dt>判定方式</dt><dd class="q">对每位属于 <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a>、在 <code class="sql">point_notify_log</code> 中尚无 <code class="sql">event_name = <span class="str">'first_gift_almost_reached'</span></code> 记录、且本次运行不满足 first_gift_reachable 条件的客户：取 <a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>；若 <code class="sql"><a href="#def-BALANCE" class="ref">BALANCE</a> &gt;= <span class="num">0.7</span> * <a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price</code>，则针对该礼品发送事件</dd><dt>去重</dt><dd class="q">每位客户一生 1 次，写入 <code class="sql">point_notify_log</code></dd><dt>备注</dt><dd>70% 的比例做成配置项。与 first_gift_reachable 共用关闭开关</dd></dl></td></tr><tr><th>属性</th><th>类型</th><th>示例</th><th>含义</th><th>计算方式</th></tr><tr><td><code>gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>礼品的简称</td><td class="q"><code class="sql">point_notify_gift_target.gift_short_name</code></td></tr><tr><td><code>gift_price</code></td><td>number</td><td>500</td><td>礼品的 Coin 价格</td><td class="q"><code class="sql">point_notify_gift_target.point_price</code></td></tr><tr><td><code>gift_image_url</code></td><td>string</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>礼品图片链接，用于 Email；未配置则为空</td><td class="q"><code class="sql">point_notify_gift_target.gift_image_url</code></td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>410</td><td>当前 Coin 余额</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>coin_to_gift</code></td><td>number</td><td>90</td><td>兑换该礼品还差的 Coin 数量</td><td class="q"><code class="sql">gift_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr><tr><td><code>lot_to_gift</code></td><td>number</td><td>2</td><td>预估还差的 lot 数，向上取整</td><td class="q"><code class="sql"><span class="fn">CEIL</span>(coin_to_gift / <a href="#def-COIN_PER_LOT" class="ref">COIN_PER_LOT</a>)</code></td></tr></table></div><div class="scroll evblock" id="ev-loyalty_weekly_summary"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_weekly_summary</code><span class="evmeta">用于消息：<a href="#msg-T7" class="ref">T7</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>定义</dt><dd>针对本周获得过 Coin 的客户的过去 7 天 Coin 总结</dd><dt>触发时间</dt><dd>周六定时任务，09:00 WIB</dd><dt>判定方式</dt><dd class="q">属于 <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> 且以下语句的 <code class="sql">week_coin</code> 大于 0 的客户（<code class="sql"><span class="prm">:week_start_date</span></code> 为上周周六，<code class="sql"><span class="prm">:week_end_date</span></code> 为刚过去的周五）：<code class="sql blk"><span class="kw">SELECT</span> <span class="fn">SUM</span>(point_earned) <span class="kw">AS</span> week_coin, <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> <span class="kw">CASE</span> <span class="kw">WHEN</span> point_earned &gt; <span class="num">0</span> <span class="kw">THEN</span> period_key <span class="kw">END</span>) <span class="kw">AS</span> trading_days
<span class="kw">FROM</span> point_task_trading_log

<h3>2.3 User properties</h3>
<p>User property 用于没有配套 event 的 campaign（M1、A1、A2），并用于排除不再符合条件的客户。</p>
<p><b>更新时间表：</b> user property 通过两种方式更新。即时方式：每当后端为客户发送一个 event 时，后端在同一次调用中同时更新该客户的 user property。定时方式：一个同步定时任务在 <b>每天 00:30 WIB</b> 运行，为当天有变化但没有任何 event 被发送的客户更新（例如 Coin 过期、客户被加入黑名单）。“何时更新”一列注明每个 user property 采用哪种方式。</p>
<div class="scroll"><table>
  <tr><th style="width:14%">名称</th><th style="width:7%">类型</th><th style="width:11%">示例</th><th style="width:16%">含义</th>
      <th style="width:22%">何时更新</th><th style="width:13%">计算方式</th><th>用途</th></tr>
  <tr><td><code>loyalty_eligible</code></td><td>boolean</td><td>true</td><td>客户当前是否具备参与资格</td><td>即时：发送 loyalty_enrolled 时设为 true。按计划：每天 00:30 WIB 的同步定时任务，将不再属于 ELIGIBLE 的客户（例如被列入黑名单）重置为 false，将重新符合条件的客户设为 true。上线前：为全部客户一次性导入</td><td class="q"><a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a></td><td>筛选 M1、A1、A2；将黑名单客户排除在所有 campaign 之外</td></tr><tr><td><code>loyalty_enrolled_date</code></td><td>datetime</td><td>2026-11-02</td><td>客户开始具备资格的日期。上线时已存在的客户则为上线日期</td><td>仅一次，与首次设置 loyalty_eligible = true 同时进行。不按计划更新</td><td class="q">发送 loyalty_enrolled 的时间</td><td>用于计算 A1、A2 的第 3 天和第 10 天</td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>当前 Coin 余额</td><td>即时：每当后端为客户发送任意一个 event 时。按计划：每天 00:30 WIB 的同步定时任务，针对当天余额有变动的客户</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td><td>筛选并插入 A1、A2 的内容</td></tr><tr><td><code>coin_lifetime</code></td><td>number</td><td>1540</td><td>累计获得的 coin 总数</td><td>即时：每当后端为客户发送任意一个 event 时。按计划：每天 00:30 WIB 的同步定时任务，针对当天余额有变动的客户</td><td class="q"><a href="#def-LIFETIME" class="ref">LIFETIME</a></td><td>分组、报表</td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>下一个礼品的简称</td><td>即时：每当后端为客户发送任意一个 event 时。按计划：每天 00:30 WIB 的同步定时任务，针对当天余额有变动的客户</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td><td>插入 A1 的内容</td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>兑换下一件礼品还差的 Coin 数量</td><td>即时：每当后端为客户发送任意一个 event 时。按计划：每天 00:30 WIB 的同步定时任务，针对当天余额有变动的客户</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td><td>插入 A1 的内容</td></tr>

<h3>2.4 通用定义</h3>
<p>在多个 event 中重复出现的概念，在此统一定义一次。</p>
<div class="scroll"><table>
  <tr><th style="width:13%">名称</th><th style="width:24%">定义</th><th style="width:40%">判定方式</th><th>备注</th></tr>
  <tr id="def-ELIGIBLE"><td><code>ELIGIBLE</code></td><td>客户在判定时刻可以参与活动计划，即 App 正在向该客户展示交易任务（task trading）。客户出现以下任一情况即被排除：（1）客户组尚未分配到活动计划，或分配记录处于关闭状态；（2）活动计划、task bundle 或 task 处于关闭状态；（3）客户的账簿类型（A Book / B Book）在活动计划、task bundle 或 task 层级被隐藏；（4）客户在活动计划层级或 task bundle 层级被列入黑名单；（5）客户尚未满足 task 的展示条件（对 HSB 而言是已完成首次入金）；（6）不在 task 的展示时间内，或 task 对所有人隐藏</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> c.client_id
<span class="kw">FROM</span> crm_customer_base c
<span class="kw">JOIN</span> promo_client_group a <span class="kw">ON</span> a.client_group = c.group_code
  <span class="kw">AND</span> a.promo_table = <span class="str">'point_program'</span>
  <span class="kw">AND</span> a.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_program b <span class="kw">ON</span> b.id = a.promo_config_id
  <span class="kw">AND</span> b.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_task_bundle tb <span class="kw">ON</span> tb.program_id = b.id
  <span class="kw">AND</span> tb.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_task_trading d <span class="kw">ON</span> d.task_bundle_id = tb.id
  <span class="kw">AND</span> d.enabled = <span class="num">1</span>
<span class="kw">WHERE</span> b.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> tb.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> d.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> (d.display_event = <span class="str">'signup'</span> <span class="kw">OR</span> (d.display_event = <span class="str">'kyc_approve'</span> <span class="kw">AND</span> c.kyc_approve_time &gt; <span class="num">0</span>) <span class="kw">OR</span> (d.display_event = <span class="str">'first_time_deposit'</span> <span class="kw">AND</span> c.first_deposit_time &gt; <span class="num">0</span>) <span class="kw">OR</span> (d.display_event = <span class="str">'first_trade'</span> <span class="kw">AND</span> c.first_real_trade_time &gt; <span class="num">0</span>))
  <span class="kw">AND</span> (d.display_period_limit_apply = <span class="num">0</span> <span class="kw">OR</span> (<span class="fn">NOW</span>() &gt;= d.display_period_from <span class="kw">AND</span> <span class="fn">NOW</span>() &lt; d.display_period_to))
  <span class="kw">AND</span> (d.display_hide_to_all = <span class="num">0</span> <span class="kw">OR</span> <span class="kw">EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> point_task_trading_log l <span class="kw">WHERE</span> l.task_id = d.id <span class="kw">AND</span> l.client_id = c.client_id))
  <span class="kw">AND</span> <span class="kw">NOT</span> <span class="kw">EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> client_promotion_blacklist bl <span class="kw">WHERE</span> bl.enabled = <span class="num">1</span> <span class="kw">AND</span> bl.promo_table = <span class="str">'point_program'</span> <span class="kw">AND</span> bl.client_id = c.client_id <span class="kw">AND</span> bl.promo_config_id = d.program_id <span class="kw">AND</span> (bl.point_task_bundle_id <span class="kw">IS</span> <span class="kw">NULL</span> <span class="kw">OR</span> bl.point_task_bundle_id = d.task_bundle_id))</code></td><td>这正是 App 当前用于展示交易任务的函数 PointTaskTradingMapper.getAppTradingTaskConfig 的条件。后端应直接复用该函数（有结果 = ELIGIBLE），而不是另写新的 query，以保证通知与 App 不出现偏差。尚未划分账簿类型的客户按现有代码处理</td></tr><tr id="def-BALANCE"><td><code>BALANCE</code></td><td>客户仍可使用的 coin 余额（未过期）</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="fn">SUM</span>(point_balance),<span class="num">0</span>)
<span class="kw">FROM</span> point_lot
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> point_expiration_time &gt; <span class="fn">NOW</span>()</code></td><td>必须与 coin 概览 API 返回给 App 的余额完全一致</td></tr><tr id="def-LIFETIME"><td><code>LIFETIME</code></td><td>客户自始至今累计获得的 coin 总数</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="fn">SUM</span>(point_amount),<span class="num">0</span>) <span class="kw">FROM</span> point_ledger <span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span> <span class="kw">AND</span> type = <span class="num">1</span></code></td><td></td></tr><tr id="def-TODAY_KEY"><td><code>TODAY_KEY</code></td><td>按 task 时区（GMT+7）计算的当前日期，格式与 period_key 字段相同</td><td class="q"><code class="sql"><span class="fn">DATE_FORMAT</span>(<span class="fn">UTC_TIMESTAMP</span>() + <span class="kw">INTERVAL</span> <span class="num">420</span> <span class="kw">MINUTE</span>, <span class="str">'%Y-%m-%d'</span>)</code></td><td>420 取自 point_task_trading.tz_minutes；格式以实际的 period_key 为准</td></tr><tr id="def-PREV_TRADING_DAY"><td><code>PREV_TRADING_DAY</code></td><td>TODAY_KEY 的前一个工作日。周一则取周五</td><td class="q">按日历计算：往前推 1 天，若落在周六或周日则继续往前推到周五</td><td></td></tr><tr id="def-TRADED_TODAY"><td><code>TRADED_TODAY</code></td><td>今天（按 GMT+7）客户在 MT5 上至少有一笔买入或卖出 deal，任意真实账户均可。开仓 deal 和平仓 deal 都计入</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="num">1</span>
<span class="kw">FROM</span> mt5_deals d

<span class="kw">WHERE</span> l.client_id = <span class="prm">:client_id</span>

  <span class="kw">AND</span> d.Time &gt;= <span class="prm">:today_start_mt5_time</span>
<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td>Action 0 = 买入，1 = 卖出；不按 Entry 过滤，以便同时包含开仓和平仓。将 GMT+7 的 00:00 换算为 MT5 服务器时间时，须采用积分计算 engine 当前的做法。不使用 point_task_trading_deal_log，因为该表只有平仓 deal</td></tr><tr id="def-NEXT_GIFT"><td><code>NEXT_GIFT</code></td><td>价格高于当前余额的最便宜的目标礼品。余额已超过最贵礼品时为空</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> gift_short_name, point_price

<span class="kw">ORDER BY</span> point_price <span class="kw">DESC</span>
<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td></td></tr><tr id="def-COIN_PER_LOT"><td><code>COIN_PER_LOT</code></td><td>客户在其各真实账户上每 lot 可获得的最高 coin 数</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="fn">MAX</span>(pc.point_per_lot)

<h2>4. 详细 Content plan</h2>
<p>文案为印尼语草稿。花括号中的文字，例如 <code>{coin_balance}</code>，是变量（macro），取自 trigger event 的属性；仅 A1 和 A2 取自 user property。在 CleverTap 上搭建时，变量按 CleverTap 的语法书写。</p>

<h3>14 条消息总览</h3>
<p>发送次数的限制分由两处负责，下表分别列出每一处：</p>
<ul>
  <li><b>后端限制</b> 的方式是不发送事件：当客户不满足条件，或已经收到过该 event 时，CleverTap 收不到任何内容，也就不会发送。</li>
  <li><b>CleverTap 限制</b> 通过各 campaign 的设置实现：event 仍会到达，但 campaign 对每位客户最多只发送已设定的次数。</li>
  <li><b>通用限制</b> 同样设置在 CleverTap：每位客户每天最多 2 条 push、每周最多 6 条 push，标注了“计入通用限制”的消息合并计算。 <span class="pending">PENDING</span> 尚未确认 CleverTap 账户是否支持通用限制和按 campaign 限制；如不支持，CleverTap 列中的各项限制须转移到后端。</li>

ance = <span class="num">0</span></code> （客户尚无 coin）</li></ol><div class="xline"><b>发送时间：</b> 自 <code class="sql">loyalty_enrolled_date</code> 起的第 3 天和第 10 天</div></td></tr><tr><td class="k">后端限制</td><td>无（该消息不使用 event）</td></tr><tr><td class="k">CleverTap 限制</td><td>每位客户最多 2 次。因为是 email，不计入 push 的通用限制</td></tr><tr><td class="k">Email：标题</td><td><span class="idn">Kenapa trading kamu belum menghasilkan Coin?</span></td></tr><tr><td class="k">Email preview</td><td><button type="button" class="pv" data-mail="A2" data-title="A2. 已交易但尚无 coin，未查看页面">查看 email preview</button><div class="pv-note">布局：品牌栏 → 大标题 → 正文段落 → 条件框 → 正文段落 → 按钮 → email 页脚</div></td></tr><tr><td class="k">中文释义</td><td>为什么您的交易还没有产生 Coin？开头：只有持有至少 3 分钟的持仓才会计入 Coin。</td></tr><tr><td class="k">Macro</td><td>（无）</td></tr><tr><td class="k">点击后打开</td><td>活动计划首页（建议） <span class="pending">PENDING</span></td></tr><tr><td class="k">备注</td><td>内容：持仓计入 Coin 的条件、可兑换的礼品</td></tr></table><h4 id="msg-M4">M4. 首笔 Coin</h4><table class="msg"><tr><td class="k">渠道</td><td>Push + Email</td></tr><tr><td class="k">Trigger</td><td><code>coin_first_earned</code><br>Event backend</td></tr><tr><td class="k">在 CleverTap 中筛选</td><td><div>不额外筛选</div></td></tr><tr><td class="k">后端限制</td><td>每位客户一生 1 个 event</td></tr><tr><td class="k">CleverTap 限制</td><td>不额外限制。不在通用限制范围内</td></tr><tr><td class="k">Push：标题</td><td><span class="idn">Coin pertamamu masuk! 🎉</span></td></tr><tr><td class="k">Push：正文</td><td><span class="idn">+<code>{coin_amount}</code> Coin dari trading kamu. Kumpulkan dan tukar dengan hadiah.</span></td></tr><tr><td class="k">Email：标题</td><td><span class="idn">Selamat, <code>{coin_amount}</code> Coin pertamamu sudah masuk</span></td></tr><tr><td class="k">Email preview</td><td><button type="button" class="pv" data-mail="M4" data-title="M4. 首笔 Coin">查看 email preview</button><div class="pv-note">布局：品牌栏 → 大标题 → 正文段落 → 礼品卡片 → 按钮 → 小字备注 → email 页脚</div></td></tr><tr><td class="k">中文释义</td><td>您的首笔 Coin 已到账！您的交易带来 +X Coin。继续累积并 <h1>HSB Loyalty Program – Kế hoạch thông báo qua CleverTap</h1>
<p class="sub">Push và Email cho chương trình HSB Loyalty. Cập nhật: 2026-10-12.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="flow" aria-selected="false">1. Luồng message</button><button type="button" role="tab" data-tab="backend" aria-selected="false">2. Backend</button><button type="button" role="tab" data-tab="frontend" aria-selected="false">3. Frontend</button><button type="button" role="tab" data-tab="content" aria-selected="false">4. Content plan</button></nav>
<section class="panel" id="flow" role="tabpanel">
<h2>1. Luồng message</h2>
<p>HSB Loyalty Program cho khách nhận Coin khi giao dịch và dùng Coin đổi quà qua đối tác TADA. Tài liệu này mô tả bộ tin Push và Email gửi qua CleverTap khi chương trình ra mắt: gửi tin gì, cho ai, lúc nào, và backend, frontend cần làm gì để gửi được. Bộ tin gồm 14 tin, dùng 9 event từ backend và 1 event từ app.</p>

<h3>Định hướng chung</h3>
<ul>
  <li><b>Mục tiêu chính là khách giao dịch nhiều hơn.</b> Các tin kích giao dịch đều quy ra quà: "còn thiếu X Coin để đổi [quà]", thay vì các mốc coin trừu tượng.</li>
  <li><b>Backend xét điều kiện, CleverTap lo câu chữ và tần suất.</b> Backend quyết định khách nào nhận event nào và gửi kèm đủ biến. CleverTap ghép nội dung và áp giới hạn số lần gửi của từng campaign.</li>
  <li><b>Hai loại event.</b> Event giao dịch bắn ngay khi sự việc xảy ra (đủ điều kiện, coin đầu tiên, đổi quà, hoàn coin). Event theo lịch do job chạy đúng giờ, xét trạng thái hiện tại của từng khách rồi bắn theo lô.</li>
  <li><b>Mỗi khách tối đa 2 push theo lịch mỗi ngày.</b> Khách đã nhận tin quà lúc 10:00 thì job 14:00 bỏ qua.</li>
  <li><b>Khách không được tham gia chương trình thì không nhận tin.</b> Chi tiết ở mục "Khi nào khách không nhận tin" bên dưới.</li>
  <li><b>Thị trường Indonesia.</b> Nội dung tiếng Indonesia, giờ gửi theo WIB (GMT+7), khách được định danh bằng <code>client_id</code>.</li>
</ul>

<h3>Khi nào khách không nhận tin</h3>
<p>Thông báo dùng đúng điều kiện mà app đang dùng để hiển thị task trading cho khách (định nghĩa <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> ở tab Backend). Khách rơi vào một trong các trường hợp sau được coi là không tham gia chương trình:</p>
<table>
  <tr><th style="width:34%">Trường hợp</th><th>Kiểm tra ở đâu</th></tr>
  <tr><td>Khách bị blacklist</td><td>Blacklist ở cấp chương trình hoặc cấp task bundle đều chặn</td></tr>
  <tr><td>Chặn theo A Book / B Book</td><td>Loại sổ của khách bị ẩn ở bất kỳ cấp nào trong ba cấp: chương trình, task bundle, task</td></tr>
  <tr><td>Chương trình đang tắt</td><td>Tắt ở bất kỳ cấp nào trong ba cấp: chương trình, task bundle, task</td></tr>
  <tr><td>Nhóm khách không thuộc chương trình</td><td>Nhóm của khách chưa được gán vào chương trình, hoặc dòng gán đang tắt</td></tr>
  <tr><td>Chưa đạt điều kiện hiển thị</td><td>Với HSB là chưa nạp tiền lần đầu; hoặc ngoài thời gian hiển thị của task; hoặc task đang ẩn với tất cả</td></tr>
</table>
<p>Mức độ chặn khác nhau theo loại tin:</p>
<table>
  <tr><th style="width:34%">Loại tin</th><th style="width:22%">Tin</th><th>Cách chặn</th></tr>
  <tr><td>Tin theo lịch và tin chào mừng</td><td><a href="#msg-M2" class="ref">M2</a>, <a href="#msg-T0" class="ref">T0</a>, <a href="#msg-T5" class="ref">T5</a>, <a href="#msg-T1" class="ref">T1</a>, <a href="#msg-T4" class="ref">T4</a>, <a href="#msg-T6" class="ref">T6</a>, <a href="#msg-M10" class="ref">M10</a>, <a href="#msg-T7" class="ref">T7</a></td><td>Backend kiểm tra ngay lúc job chạy; khách không đủ điều kiện thì không bắn event. Chặn có hiệu lực ngay</td></tr>
  <tr><td>Campaign đặt trong CleverTap</td><td><a href="#msg-M1" class="ref">M1</a>, <a href="#msg-A1" class="ref">A1</a>, <a href="#msg-A2" class="ref">A2</a></td><td>Lọc theo user property <code>loyalty_eligible</code>, được backend đồng bộ lúc 00:30 mỗi ngày. Chặn có thể trễ tối đa một ngày</td></tr>
  <tr><td>Tin giao dịch</td><td><a href="#msg-M4" class="ref">M4</a>, <a href="#msg-M12" class="ref">M12</a>, <a href="#msg-M13" class="ref">M13</a></td><td>Hiện không kiểm tra điều kiện tham gia: khách vừa được cộng coin, đổi quà hoặc được hoàn coin thì vẫn nhận tin xác nhận. Chờ chốt</td></tr>
</table>

<h3>Sơ đồ 1: Hành trình của khách và tin tương ứng</h3>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">1. Đủ điều kiện</div><div class="fd">Khách nạp tiền lần đầu (FTD) và thuộc nhóm được tham gia chương trình.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M1" class="ref">M1</a></td><td class="n">Ra mắt chương trình</td><td>Thông báo chương trình đã ra mắt. Gửi một lần vào ngày launch cho mọi khách đang đủ điều kiện.</td></tr><tr><td class="c"><a href="#msg-M2" class="ref">M2</a></td><td class="n">Chào mừng khách mới</td><td>Dành cho khách đủ điều kiện sau ngày launch. Gửi vài giờ sau khi khách nạp tiền lần đầu, báo rằng tài khoản đã bắt đầu tích coin.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">2. Chưa có coin</div><div class="fd">Khách đã nạp tiền nhưng chưa nhận được coin nào.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T0" class="ref">T0</a></td><td class="n">Nhắc nhận coin đầu tiên</td><td>Gửi lúc 14:00 các ngày thứ 2–6 khi hôm đó khách chưa giao dịch. Chỉ gửi trong 14 ngày kể từ lần nạp đầu, tối đa 3 lần, sau đó dừng hẳn.</td></tr><tr><td class="c"><a href="#msg-A2" class="ref">A2</a></td><td class="n">Giải thích điều kiện nhận coin</td><td>Email cho khách đã giao dịch nhưng số dư vẫn bằng 0 và chưa từng mở trang chương trình. Giải thích lệnh phải giữ tối thiểu 3 phút mới được tính coin.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">3. Coin đầu tiên</div><div class="fd">Lần đầu tiên trong đời khách được cộng coin.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M4" class="ref">M4</a></td><td class="n">Chúc mừng coin đầu tiên</td><td>Gửi ngay khi khách được cộng coin lần đầu, kèm lời nhắc rằng coin dùng để đổi quà.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">4. Tích lũy hằng ngày</div><div class="fd">Khách giao dịch, số dư coin tăng dần. Đây là giai đoạn khách ở lại lâu nhất và là trọng tâm của bộ tin.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T5" class="ref">T5</a></td><td class="n">Nhắc theo lần giao dịch gần nhất</td><td>Gửi lúc 14:00 (thứ 2–6) cho khách hôm nay chưa giao dịch nhưng ngày làm việc liền trước có nhận coin. Nhắc lại số coin của lần trước và số coin còn thiếu để đổi món quà kế tiếp. Tối đa 2 lần/tuần.</td></tr><tr><td class="c"><a href="#msg-T1" class="ref">T1</a></td><td class="n">Hôm nay chưa giao dịch</td><td>Gửi lúc 14:00 (thứ 2–6) cho khách hôm nay chưa giao dịch và ngày làm việc liền trước cũng không có coin, nhưng trước đây đã từng nhận coin. Kêu gọi giao dịch hôm nay, nêu số coin mỗi lot và số coin còn thiếu để đổi quà. Tối đa 1 lần/tuần; dừng khi khách đã 14 ngày liên tiếp không có coin.</td></tr><tr><td class="c"><a href="#msg-T4" class="ref">T4</a></td><td class="n">Tổng kết hôm nay</td><td>Gửi lúc 19:30 (thứ 2–6) cho khách đã nhận coin trong ngày. Báo hôm nay nhận bao nhiêu coin, còn thiếu bao nhiêu để đổi món quà kế tiếp, và mời giao dịch tiếp trong phiên tối. Tối đa 3 lần/tuần.</td></tr><tr><td class="c"><a href="#msg-T7" class="ref">T7</a></td><td class="n">Tổng kết tuần</td><td>Email gửi sáng thứ 7 cho khách có nhận coin trong tuần. Gồm số coin của tuần, số ngày có giao dịch, số dư hiện tại, và bảng 3 món quà kèm phần trăm tiến độ tới từng món.</td></tr><tr><td class="c"><a href="#msg-A1" class="ref">A1</a></td><td class="n">Có coin nhưng chưa xem trang</td><td>Dành cho khách đã có từ 100 coin nhưng chưa từng mở trang chương trình trong app. Báo số coin đang có và quà đổi được. Gửi vào ngày thứ 3 và ngày thứ 10 sau khi khách đủ điều kiện.</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">5. Chạm quà</div><div class="fd">Số dư coin tới gần hoặc đủ giá một món quà mục tiêu.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-T6" class="ref">T6</a></td><td class="n">Sắp đủ đổi quà</td><td>Gửi khi số dư lần đầu đạt 70% giá món quà kế tiếp. Mỗi khách chỉ nhận một lần trong đời.</td></tr><tr><td class="c"><a href="#msg-M10" class="ref">M10</a></td><td class="n">Đã đủ đổi quà</td><td>Gửi khi số dư lần đầu đủ để đổi một món quà. Mỗi khách chỉ nhận một lần trong đời.</td></tr></table><div class="fnote" id="note-gift"><b>Lưu ý: đây là giải pháp riêng cho đợt launch phase 1.</b> Hai tin nhắc chạm quà được thiết kế khi chúng ta còn hiểu biết hạn chế về hệ thống TADA. Vì vậy mỗi tin chỉ gửi <b>một lần trong đời</b> cho mỗi khách, để tránh spam. Sau khi tích hợp xong với TADA và hiểu rõ hệ thống, phần này có thể được bỏ đi và thay bằng một bộ thông báo nhận quà, nhận thưởng hấp dẫn hơn.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">6. Đổi quà</div><div class="fd">Khách đổi coin lấy quà trong webview của TADA. Ở giai đoạn này có hai bên cùng gửi tin cho khách.</div></div><table class="fmsg"><tr><td class="c"><a href="#msg-M12" class="ref">M12</a></td><td class="n">Đổi quà thành công</td><td>Do HSB gửi qua CleverTap, ngay khi coin bị trừ. Chỉ xác nhận về coin: đã đổi bao nhiêu coin và số dư còn lại. Tin này không chứa voucher.</td></tr><tr><td class="c"><a href="#msg-M13" class="ref">M13</a></td><td class="n">Hoàn coin</td><td>Do HSB gửi qua CleverTap, ngay khi coin của một lần đổi quà được hoàn lại. Chỉ xác nhận số coin được hoàn và số dư mới.</td></tr></table><div class="fnote" id="note-tada"><b>Ai gửi cái gì trong luồng đổi quà:</b><table class="inner"><tr><th>Bên gửi</th><th>Gửi gì</th><th>Kênh</th><th>Có trong tài liệu này không</th></tr><tr><td>TADA</td><td>Voucher của món quà: mã quà và hướng dẫn sử dụng</td><td>Email từ hệ thống của TADA</td><td>Không. HSB không soạn và không kiểm soát nội dung này</td></tr><tr><td>HSB (qua CleverTap)</td><td>Xác nhận về coin: M12 khi coin bị trừ, M13 khi coin được hoàn</td><td>M12: Push. M13: Push và Email</td><td>Có</td></tr></table>M12 không có Email để khách không nhận hai email cùng lúc cho một lần đổi quà.</div></div></div>
<p class="note">Sau khi đổi quà, khách quay lại giai đoạn 4 và tiếp tục tích lũy. Bấm vào mã tin để xem câu chữ chi tiết.</p>

<h3>Sơ đồ 2: Một ngày của các job theo lịch</h3>
<p>Ba job dưới đây chạy lần lượt trong ngày. Trong mỗi job, backend xét các điều kiện theo thứ tự từ trên xuống và dừng ở điều kiện đầu tiên khớp.</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">10:00 WIB, mỗi ngày kể cả cuối tuần</div><div class="fd"><b>Job quà</b></div><div class="fd">Mỗi sáng, backend so số dư coin của từng khách với danh sách quà mục tiêu, để báo cho khách biết lần đầu tiên họ sắp đủ hoặc đã đủ coin đổi một món quà. Mỗi khách chỉ nhận mỗi loại tin một lần trong đời; lý do xem <a href="#note-gift" class="ref">lưu ý ở giai đoạn 5. Chạm quà</a> của sơ đồ 1.<br><br>Danh sách quà mục tiêu được cấu hình ở phía HSB: sao chép lại thông tin của một số món quà hấp dẫn mà chúng ta đã cấu hình trên TADA, với cùng số coin. Chi tiết ở bảng <a href="#tbl-point_notify_gift_target" class="ref">point_notify_gift_target</a> thuộc tab Backend.</div></div><table class="fmsg"><tr><th class="c">Thứ tự xét</th><th>Điều kiện</th><th class="r">Kết quả</th></tr><tr><td class="c">1</td><td>Số dư đã đủ đổi ít nhất một món quà, và khách chưa từng nhận tin "đã đủ đổi quà"</td><td class="r">Gửi <a href="#msg-M10" class="ref">M10</a> cho món đắt nhất mà khách đủ coin đổi</td></tr><tr><td class="c">2</td><td>Không thuộc trường hợp trên; số dư đạt từ 70% giá món quà kế tiếp, và khách chưa từng nhận tin "sắp đủ đổi quà"</td><td class="r">Gửi <a href="#msg-T6" class="ref">T6</a> cho món quà đó</td></tr><tr><td class="c">3</td><td>Các trường hợp còn lại</td><td class="r">Không gửi</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">14:00 WIB, thứ 2 đến thứ 6</div><div class="fd"><b>Nhắc đầu giờ chiều</b></div><div class="fd">Đầu giờ chiều, backend tìm những khách hôm nay chưa giao dịch để nhắc họ vào giao dịch. Nội dung nhắc khác nhau tùy lịch sử của khách, và mỗi khách nhận nhiều nhất một tin.</div></div><table class="fmsg"><tr><th class="c">Thứ tự xét</th><th>Điều kiện</th><th class="r">Kết quả</th></tr><tr><td class="c">1</td><td>Khách đã nhận tin quà lúc 10:00 hôm nay</td><td class="r">Không gửi, để tránh hai tin trong cùng một buổi</td></tr><tr><td class="c">2</td><td>Hôm nay khách đã có ít nhất một lệnh mở hoặc đóng trên MT5</td><td class="r">Không gửi, vì khách đã giao dịch</td></tr><tr><td class="c">3</td><td>Khách chưa từng nhận coin, và còn trong 14 ngày kể từ lần nạp tiền đầu</td><td class="r">Gửi <a href="#msg-T0" class="ref">T0</a></td></tr><tr><td class="c">4</td><td>Khách đã từng nhận coin, và ngày làm việc liền trước có nhận coin (chưa chạm trần của ngày đó)</td><td class="r">Gửi <a href="#msg-T5" class="ref">T5</a></td></tr><tr><td class="c">5</td><td>Khách đã từng nhận coin, ngày làm việc liền trước không có coin, và lần nhận coin gần nhất chưa quá 14 ngày</td><td class="r">Gửi <a href="#msg-T1" class="ref">T1</a></td></tr><tr><td class="c">6</td><td>Các trường hợp còn lại, ví dụ đã quá 14 ngày sau lần nạp đầu mà chưa có coin, hoặc đã hơn 14 ngày không nhận coin</td><td class="r">Không gửi</td></tr></table></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">19:30 WIB, thứ 2 đến thứ 6</div><div class="fd"><b>Tổng kết ngày</b></div><div class="fd">Buổi tối, trước phiên Mỹ, backend gửi tổng kết cho những khách đã nhận coin trong ngày: hôm nay được bao nhiêu coin và còn thiếu bao nhiêu để đổi món quà kế tiếp.</div></div><table class="fmsg"><tr><th class="c">Thứ tự xét</th><th>Điều kiện</th><th class="r">Kết quả</th></tr><tr><td class="c">1</td><td>Hôm nay khách có nhận coin, kể cả khi đã chạm trần coin của ngày</td><td class="r">Gửi <a href="#msg-T4" class="ref">T4</a></td></tr><tr><td class="c">2</td><td>Hôm nay khách không nhận coin</td><td class="r">Không gửi</td></tr></table></div></div>
<p class="note">Ngoài ba job trên: email tổng kết tuần (<a href="#msg-T7" class="ref">T7</a>) gửi sáng thứ 7 lúc 09:00 WIB; các tin <a href="#msg-M2" class="ref">M2</a>, <a href="#msg-M4" class="ref">M4</a>, <a href="#msg-M12" class="ref">M12</a>, <a href="#msg-M13" class="ref">M13</a> gửi ngay khi sự việc xảy ra; <a href="#msg-A1" class="ref">A1</a> và <a href="#msg-A2" class="ref">A2</a> là campaign đặt lịch trong CleverTap.</p>

<h2>2. Việc của backend</h2>
<p>Backend cần tạo 2 bảng mới, bắn 9 event sang CleverTap, và cập nhật 6 user property. Tên event và thuộc tính viết kiểu <code>snake_case</code>. Các câu query viết theo cấu trúc bảng hiện có, chưa chạy thử trên DB.</p>

<h3>2.1 Bảng mới</h3>
<h4 id="tbl-point_notify_gift_target"><code>point_notify_gift_target</code></h4><p>Danh sách quà mục tiêu do HSB tự cấu hình, dùng để tính 'quà kế tiếp' và 'còn thiếu bao nhiêu coin' trong các tin nhắn. Mỗi dòng sao chép lại thông tin của một món quà hấp dẫn mà HSB đã cấu hình trên TADA, với cùng số coin. Nhập tay, không đồng bộ tự động từ TADA, nên khi đổi quà hoặc đổi giá trên TADA phải sửa lại bảng này. Dự kiến 5–6 dòng</p><div class="scroll"><table><tr><th style="width:20%">Cột</th><th style="width:15%">Kiểu</th><th style="width:8%">Bắt buộc</th><th style="width:19%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>id</code></td><td>bigint, tự tăng</td><td>Có</td><td>1</td><td>Khóa chính</td></tr><tr><td><code>program_id</code></td><td>bigint</td><td>Có</td><td>1001</td><td>Chương trình áp dụng, trỏ tới point_program.id</td></tr><tr><td><code>gift_name</code></td><td>varchar(128)</td><td>Có</td><td>Saldo GoPay Rp50.000</td><td>Tên đầy đủ của món quà, dùng trong email</td></tr><tr><td><code>gift_short_name</code></td><td>varchar(32)</td><td>Có</td><td>GoPay Rp50.000</td><td>Tên rút gọn dùng trong push. Nên giữ dưới 25 ký tự để tiêu đề push không bị cắt</td></tr><tr><td><code>point_price</code></td><td>bigint</td><td>Có</td><td>500</td><td>Giá coin của món quà, phải bằng đúng giá đang cấu hình trên TADA. Hai món đang bật trong cùng chương trình không được trùng giá</td></tr><tr><td><code>gift_image_url</code></td><td>varchar(512)</td><td>Không</td><td>https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png</td><td>Đường dẫn tới hình ảnh của món quà, gửi kèm event sang CleverTap để hiển thị trong email. Phải là link https công khai, không cần đăng nhập, và đặt trên máy chủ ảnh của HSB để link không đổi. Để trống thì email hiển thị không có hình</td></tr><tr><td><code>enabled</code></td><td>tinyint</td><td>Có</td><td>1</td><td>1 = đang dùng, 0 = tắt. Tắt hết các dòng thì các tin không còn nhắc quà</td></tr><tr><td><code>remark</code></td><td>varchar(255)</td><td>Không</td><td>Đối chiếu TADA ngày 2026-11-01</td><td>Ghi chú tự do, ví dụ ngày đối chiếu giá với TADA gần nhất</td></tr><tr><td><code>create_date, create_user, update_date, update_user</code></td><td>như các bảng point_ khác</td><td>Có</td><td></td><td>Thông tin tạo và sửa</td></tr></table></div><h4 id="tbl-point_notify_log"><code>point_notify_log</code></h4><p>Ghi lại mỗi event backend đã bắn sang CleverTap, để chống bắn trùng và để kiểm tra giới hạn (1 lần trong đời, 1 lần mỗi ngày, 1 lần mỗi tuần)</p><div class="scroll"><table><tr><th style="width:20%">Cột</th><th style="width:15%">Kiểu</th><th style="width:8%">Bắt buộc</th><th style="width:19%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>id</code></td><td>bigint, tự tăng</td><td>Có</td><td>1</td><td>Khóa chính</td></tr><tr><td><code>client_id</code></td><td>bigint</td><td>Có</td><td>7200123</td><td>Khách nhận event</td></tr><tr><td><code>event_name</code></td><td>varchar(64)</td><td>Có</td><td>first_gift_reachable</td><td>Tên event đã bắn</td></tr><tr><td><code>ref_key</code></td><td>varchar(64)</td><td>Có</td><td>2026-11-03</td><td>Khóa chống trùng theo từng loại event: event một lần trong đời dùng 'lifetime'; event theo ngày dùng ngày GMT+7; event theo tuần dùng ngày thứ 7 của tuần; coin_redeemed và coin_refunded dùng redemption_id</td></tr><tr><td><code>payload</code></td><td>json</td><td>Không</td><td>{"gift_name":"GoPay Rp50.000"}</td><td>Các thuộc tính đã gửi kèm event, để tra soát khi khách thắc mắc</td></tr><tr><td><code>send_status</code></td><td>tinyint</td><td>Có</td><td>1</td><td>1 = CleverTap nhận thành công, 0 = lỗi</td></tr><tr><td><code>create_date</code></td><td>datetime</td><td>Có</td><td></td><td>Thời điểm bắn</td></tr><tr><td>(khóa duy nhất)</td><td>client_id + event_name + ref_key</td><td></td><td></td><td>Chặn bắn trùng ở mức cơ sở dữ liệu</td></tr></table></div>

<h3>2.2 Event và thuộc tính của event</h3>
<p>Mỗi event gửi sang CleverTap qua API upload phía server, định danh khách bằng <code>client_id</code>. Ví dụ:</p>
<pre>{
  "d": [{
    "identity": "7200123",
    "type": "event",
    "evtName": "loyalty_daily_summary",
    "evtData": { "today_coin": 140, "coin_balance": 460, "next_gift_name": "GoPay Rp50.000", "coin_to_next_gift": 40 }
  }]
}</pre>
<p>Giờ chạy của từng event ghi ở dòng "Thời điểm bắn" trong khối của event đó; các giờ này để ở dạng cấu hình.</p>
<p>Mỗi lần bắn thành công, ghi một dòng vào <code>point_notify_log</code>. Các tên viết hoa trong cột "Cách tính" (ví dụ <code>BALANCE</code>) là định nghĩa dùng chung ở mục 2.4.</p>
<p><b>Quy ước hiển thị số:</b> Bản chuỗi đã định dạng kiểu Indonesia của mỗi thuộc tính số dùng để hiển thị (ví dụ coin_balance_text).</p>
<div class="scroll evblock" id="ev-loyalty_enrolled"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_enrolled</code><span class="evmeta">Dùng cho tin: <a href="#msg-M2" class="ref">M2</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Khách lần đầu trở nên đủ điều kiện tham gia chương trình, sau ngày launch. Với khách mới, thực tế là thời điểm hoàn tất nạp tiền lần đầu; cũng có thể là lúc khách được gỡ blacklist hoặc chương trình được bật cho nhóm của khách</dd><dt>Thời điểm bắn</dt><dd>Job quét mỗi 10 phút</dd><dt>Cách xác định</dt><dd class="q">Lấy khách thuộc <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a> mà chưa có dòng <code class="sql">event_name = <span class="str">'loyalty_enrolled'</span></code> trong <code class="sql">point_notify_log</code></dd><dt>Chống lặp</dt><dd class="q">Mỗi khách 1 lần trong đời, ghi vào <code class="sql">point_notify_log</code></dd><dt>Ghi chú</dt><dd>Trước giờ launch: ghi sẵn point_notify_log cho toàn bộ khách đang ELIGIBLE nhưng KHÔNG bắn event (nhóm này nhận M1). Bảng mới cần tạo: point_notify_log (id, client_id, event_name, ref_key, create_date)</dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách tính</th></tr><tr><td><code>coin_per_lot</code></td><td>number</td><td>80</td><td>Coin mỗi lot cao nhất khách nhận được</td><td class="q"><a href="#def-COIN_PER_LOT" class="ref">COIN_PER_LOT</a></td></tr><tr><td><code>enrolled_at</code></td><td>datetime</td><td>2026-11-02T09:15:00+07:00</td><td>Thời điểm đủ điều kiện</td><td class="q">Thời điểm job phát hiện</td></tr></table></div><div class="scroll evblock" id="ev-coin_first_earned"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">coin_first_earned</code><span class="evmeta">Dùng cho tin: <a href="#msg-M4" class="ref">M4</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Lần đầu tiên trong đời khách được cộng coin</dd><dt>Thời điểm bắn</dt><dd>Ngay sau khi job phát điểm ghi dòng cộng coin</dd><dt>Cách xác định</dt><dd class="q">Dòng <code class="sql">point_ledger</code> mới có <code class="sql">type = <span class="num">1</span></code> và <code class="sql">point_amount &gt; <span class="num">0</span></code>, và không tồn tại dòng nào như vậy trước đó. Kiểm tra bằng câu sau, kết quả phải bằng 0: <code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COUNT</span>(*)
<span class="kw">FROM</span> point_ledger
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>

  <span class="kw">AND</span> id &lt; <span class="prm">:new_row_id</span></code></dd><dt>Chống lặp</dt><dd class="q">Mỗi khách 1 lần trong đời, ghi vào <code class="sql">point_notify_log</code></dd></dl></td></tr><tr><th>Thuộc tính</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th><th>Cách tính</th></tr><tr><td><code>coin_amount</code></td><td>number</td><td>80</td><td>Số coin của lần cộng đầu tiên</td><td class="q"><code class="sql">point_ledger.point_amount</code> của dòng mới</td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>Số dư coin hiện tại</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Tên rút gọn của quà kế tiếp; trống nếu không còn món nào cao hơn số dư</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td></tr><tr><td><code>coin_to_next_gift</code></td><td>number</td><td>180</td><td>Số coin còn thiếu để đổi quà kế tiếp</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.point_price - <a href="#def-BALANCE" class="ref">BALANCE</a></code></td></tr></table></div><div class="scroll evblock" id="ev-loyalty_daily_nudge"><table class="events"><colgroup><col style="width:19%"><col style="width:8%"><col style="width:17%"><col style="width:27%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">loyalty_daily_nudge</code><span class="evmeta">Dùng cho tin: <a href="#msg-T0" class="ref">T0</a>, <a href="#msg-T5" class="ref">T5</a>, <a href="#msg-T1" class="ref">T1</a></span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Khái niệm</dt><dd>Lời nhắc đầu giờ chiều cho khách chưa giao dịch trong ngày. Mỗi khách chỉ thuộc đúng một loại (nudge_type) hoặc không nhận</dd><dt>Thời điểm bắn</dt><dd>Job 14:00 WIB, thứ 2 đến thứ 6</dd><dt>Cách xác định</dt><dd class="q">Với mỗi khách thuộc <a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a>, hôm nay chưa giao dịch (<a href="#def-TRADED_TODAY" class="ref">TRADED_TODAY</a> không có kết quả) và hôm nay chưa nhận event quà, xét theo thứ tự: (1) <a href="#def-LIFETIME" class="ref">LIFETIME</a> bằng 0 và còn trong 14 ngày kể từ lần nạp đầu thì <code class="sql">nudge_type = first_coin</code>; (2) <a href="#def-LIFETIME" class="ref">LIFETIME</a> lớn hơn 0, coin của <a href="#def-PREV_TRADING_DAY" class="ref">PREV_TRADING_DAY</a> lớn hơn 0 và chưa chạm trần ngày đó thì <code class="sql">nudge_type = last_trade_earned</code>; (3) <a href="#def-LIFETIME" class="ref">LIFETIME</a> lớn hơn 0, coin của <a href="#def-PREV_TRADING_DAY" class="ref">PREV_TRADING_DAY</a> bằng 0 và ngày gần nhất có coin cách hôm nay không quá 14 ngày thì <code class="sql">nudge_type = not_traded</code>; còn lại không bắn. Hôm nay chưa nhận event quà nghĩa là câu sau không có kết quả: <code class="sql blk"><span class="kw">SELECT</span> <span class="num">1</span>
<span class="kw">FROM</span> point_notify_log
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>
  <span class="kw">AND</span> event_name <span class="kw">IN</span> (<span class="str">'first_gift_reachable'</span>,<span class="str">'first_gift_almost_reached'</span>)
  <span class="kw">AND</span> create_date &gt;= <span class="prm">:today_start_gmt7</span></code> Còn trong 14 ngày kể từ lần nạp đầu: <code class="sql"><span class="fn">NOW</span>() &lt;= <span class="fn">FROM_UNIXTIME</span>(first_deposit_time / <span class="num">1000</span>) + <span class="kw">INTERVAL</span> <span class="num">14</span> <span class="kw">DAY</span></code> Coin của một ngày: <code class="sql blk"><span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="fn">SUM</span>(point_earned),<span class="num">0</span>)
<span class="kw">FROM</span> point_task_trading_log
<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>

<h3>2.3 User properties</h3>
<p>User property dùng cho các campaign không có event đi kèm (M1, A1, A2) và để loại khách không còn đủ điều kiện.</p>
<p><b>Lịch cập nhật:</b> user property được cập nhật theo hai cách. Cách tức thời: mỗi khi backend bắn một event cho khách, backend cập nhật luôn các user property của khách đó trong cùng lần gọi. Cách theo lịch: một job đồng bộ chạy lúc <b>00:30 WIB mỗi ngày</b>, cập nhật cho những khách có thay đổi trong ngày mà không có event nào được bắn (ví dụ coin hết hạn, khách bị blacklist). Cột "Cập nhật khi nào" ghi rõ từng user property dùng cách nào.</p>
<div class="scroll"><table>

      <th style="width:22%">Cập nhật khi nào</th><th style="width:13%">Cách tính</th><th>Dùng để</th></tr>
  <tr><td><code>loyalty_eligible</code></td><td>boolean</td><td>true</td><td>Khách hiện có đủ điều kiện tham gia không</td><td>Tức thời: đặt true khi bắn loyalty_enrolled. Theo lịch: job đồng bộ 00:30 WIB mỗi ngày đặt lại false cho khách không còn thuộc ELIGIBLE (ví dụ bị blacklist) và true cho khách đủ điều kiện trở lại. Trước launch: nạp một lần cho toàn bộ khách</td><td class="q"><a href="#def-ELIGIBLE" class="ref">ELIGIBLE</a></td><td>Lọc M1, A1, A2; loại khách bị blacklist khỏi mọi campaign</td></tr><tr><td><code>loyalty_enrolled_date</code></td><td>datetime</td><td>2026-11-02</td><td>Ngày khách bắt đầu đủ điều kiện. Khách có sẵn lúc launch thì là ngày launch</td><td>Một lần duy nhất, cùng lúc lần đầu đặt loyalty_eligible = true. Không theo lịch</td><td class="q">Thời điểm bắn loyalty_enrolled</td><td>Tính ngày thứ 3 và thứ 10 cho A1, A2</td></tr><tr><td><code>coin_balance</code></td><td>number</td><td>320</td><td>Số dư coin hiện tại</td><td>Tức thời: mỗi khi backend bắn một event bất kỳ cho khách. Theo lịch: job đồng bộ 00:30 WIB mỗi ngày, cho khách có biến động số dư trong ngày</td><td class="q"><a href="#def-BALANCE" class="ref">BALANCE</a></td><td>Lọc và chèn nội dung A1, A2</td></tr><tr><td><code>coin_lifetime</code></td><td>number</td><td>1540</td><td>Tổng coin đã từng nhận</td><td>Tức thời: mỗi khi backend bắn một event bất kỳ cho khách. Theo lịch: job đồng bộ 00:30 WIB mỗi ngày, cho khách có biến động số dư trong ngày</td><td class="q"><a href="#def-LIFETIME" class="ref">LIFETIME</a></td><td>Phân nhóm, báo cáo</td></tr><tr><td><code>next_gift_name</code></td><td>string</td><td>Saldo GoPay Rp50.000</td><td>Tên rút gọn của quà kế tiếp</td><td>Tức thời: mỗi khi backend bắn một event bất kỳ cho khách. Theo lịch: job đồng bộ 00:30 WIB mỗi ngày, cho khách có biến động số dư trong ngày</td><td class="q"><code class="sql"><a href="#def-NEXT_GIFT" class="ref">NEXT_GIFT</a>.gift_short_name</code></td><td>Chèn nội dung A1</td></tr><tr><td><code>coin_to_next_gift</ <h3>2.4 Định nghĩa dùng chung</h3>
<p>Các khái niệm lặp lại ở nhiều event, định nghĩa một lần ở đây.</p>
<div class="scroll"><table>
  <tr><th style="width:13%">Tên</th><th style="width:24%">Khái niệm</th><th style="width:40%">Cách xác định</th><th>Ghi chú</th></tr>
  <tr id="def-ELIGIBLE"><td><code>ELIGIBLE</code></td><td>Khách đang được tham gia chương trình tại thời điểm xét, tức là app đang hiển thị task trading cho khách. Khách bị loại khi rơi vào một trong các trường hợp: (1) nhóm khách chưa được gán vào chương trình hoặc dòng gán đang tắt; (2) chương trình, task bundle hoặc task đang tắt; (3) loại sổ của khách (A Book / B Book) bị ẩn ở cấp chương trình, task bundle hoặc task; (4) khách bị blacklist ở cấp chương trình hoặc cấp task bundle; (5) khách chưa đạt điều kiện hiển thị của task (với HSB là đã nạp tiền lần đầu); (6) ngoài thời gian hiển thị của task, hoặc task đang ẩn với tất cả</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> c.client_id
<span class="kw">FROM</span> crm_customer_base c
<span class="kw">JOIN</span> promo_client_group a <span class="kw">ON</span> a.client_group = c.group_code
  <span class="kw">AND</span> a.promo_table = <span class="str">'point_program'</span>
  <span class="kw">AND</span> a.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_program b <span class="kw">ON</span> b.id = a.promo_config_id
  <span class="kw">AND</span> b.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_task_bundle tb <span class="kw">ON</span> tb.program_id = b.id
  <span class="kw">AND</span> tb.enabled = <span class="num">1</span>
<span class="kw">JOIN</span> point_task_trading d <span class="kw">ON</span> d.task_bundle_id = tb.id
  <span class="kw">AND</span> d.enabled = <span class="num">1</span>
<span class="kw">WHERE</span> b.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> tb.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> d.display_hide_book_type &lt;&gt; c.client_book_type
  <span class="kw">AND</span> (d.display_event = <span class="str">'signup'</span> <span class="kw">OR</span> (d.display_event = <span class="str">'kyc_approve'</span> <span class="kw">AND</span> c.kyc_approve_time &gt; <span class="num">0</span>) <span class="kw">OR</span> (d.display_event = <span class="str">'first_time_deposit'</span> <span class="kw">AND</span> c.first_deposit_time &gt; <span class="num">0</span>) <span class="kw">OR</span> (d.display_event = <span class="str">'first_trade'</span> <span class="kw">AND</span> c.first_real_trade_time &gt; <span class="num">0</span>))
  <span class="kw">AND</span> (d.display_period_limit_apply = <span class="num">0</span> <span class="kw">OR</span> (<span class="fn">NOW</span>() &gt;= d.display_period_from <span class="kw">AND</span> <span class="fn">NOW</span>() &lt; d.display_period_to))
  <span class="kw">AND</span> (d.display_hide_to_all = <span class="num">0</span> <span class="kw">OR</span> <span class="kw">EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> point_task_trading_log l <span class="kw">WHERE</span> l.task_id = d.id <span class="kw">AND</span> l.client_id = c.client_id))

<span class="kw">WHERE</span> client_id = <span class="prm">:client_id</span>

<span class="kw">FROM</span> mt5_deals d

  <span class="kw">AND</span> d.Time &gt;= <span class="prm">:today_start_mt5_time</span>
<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td>Action 0 = mua, 1 = bán; không lọc theo Entry để lấy cả mở và đóng. Đổi mốc 00:00 GMT+7 sang giờ máy chủ MT5 bằng đúng cách engine tính điểm đang làm. Không dùng point_task_trading_deal_log vì bảng đó chỉ có deal đóng lệnh</td></tr><tr id="def-NEXT_GIFT"><td><code>NEXT_GIFT</code></td><td>Món quà mục tiêu rẻ nhất có giá cao hơn số dư hiện tại. Trống khi số dư đã vượt món đắt nhất</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> gift_short_name, point_price

<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td>Bảng mới cần tạo: point_notify_gift_target (id, gift_name, gift_short_name, point_price, enabled). Danh sách quà nhập tay, dự kiến 5–6 món để tên quà trong các tin hàng ngày thay đổi thường xuyên</td></tr><tr id="def-REACHABLE_GIFT"><td><code>REACHABLE_GIFT</code></td><td>Món quà mục tiêu đắt nhất mà số dư hiện tại đã đủ đổi. Trống khi chưa đủ đổi món nào</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> gift_short_name, point_price

<span class="kw">WHERE</span> enabled = <span class="num">1</span>

<span class="kw">ORDER BY</span> point_price <span class="kw">DESC</span>
<span class="kw">LIMIT</span> <span class="num">1</span></code></td><td></td></tr><tr id="def-COIN_PER_LOT"><td><code>COIN_PER_LOT</code></td><td>Số coin mỗi lot cao nhất mà khách có thể nhận trên các tài khoản thật của mình</td><td class="q"><code class="sql blk"><span class="kw">SELECT</span> <span class="fn">MAX</span>(pc.point_per_lot)

<span class="kw">WHERE</span> l.client_id = <span class="prm">:client_id</span>

<h2>3. Việc của frontend</h2>
<p>Phần việc của app cho bộ tin này gồm 1 event và các deeplink khi khách bấm vào push.</p>

<h3>3.1 Event phía app</h3>
<p>Mục này chỉ liệt kê tên event mà bộ tin cần. Mô tả chi tiết (thời điểm bắn, thuộc tính, cách thực hiện) nằm ở <b>tài liệu về front-end event</b>, là tài liệu riêng dùng chung cho việc tracking của app. <span class="pending">PENDING</span> Link tài liệu sẽ được bổ sung.</p>

</section><section class="panel" id="content" role="tabpanel">
<h2>4. Content plan chi tiết</h2>
<p>Câu chữ là bản nháp tiếng Indonesia. Chữ trong ngoặc nhọn, ví dụ <code>{coin_balance}</code>, là biến (macro), lấy từ thuộc tính của event trigger; riêng A1 và A2 lấy từ user property. Khi dựng trên CleverTap, biến được viết theo cú pháp của CleverTap.</p>

<h3>Tổng quan 14 tin</h3>
<p>Việc giới hạn số lần gửi được chia cho hai nơi, và bảng dưới ghi riêng từng nơi:</p>
<ul>
  <li><b>Backend giới hạn</b> bằng cách không bắn event: khi khách không thỏa điều kiện, hoặc đã nhận event đó rồi, thì CleverTap không nhận được gì để gửi.</li>
  <li><b>CleverTap giới hạn</b> bằng cài đặt của từng campaign: event vẫn tới, nhưng campaign chỉ gửi tối đa số lần đã đặt cho mỗi khách.</li>
  <li><b>Giới hạn chung</b> cũng đặt ở CleverTap: mỗi khách tối đa 2 push mỗi ngày và 6 push mỗi tuần, tính gộp các tin có ghi "Tính vào giới hạn chung". <span class="pending">PENDING</span> Chưa xác nhận tài khoản CleverTap có hỗ trợ giới hạn chung và giới hạn theo campaign; nếu không, các giới hạn ở cột CleverTap phải chuyển về backend.</li>
</ul>

nt sẵn có: khách đã nạp tiền lần đầu)</li><li>Đã có event <code class="sql">first_real_position_open_success</code> (event sẵn có: khách đã mở lệnh thật đầu tiên)</li><li>Chưa từng có event <code class="sql">loyalty_page_viewed</code> (khách chưa mở trang chương trình)</li><li><code class="sql">coin_balance &gt;= <span class="num">100</span></code> (khách đã có từ 100 coin)</li></ol><div class="xline"><b>Lịch gửi:</b> ngày thứ 3 và ngày thứ 10 tính từ <code class="sql">loyalty_enrolled_date</code></div></td></tr><tr><td class="k">Backend giới hạn</td><td>Không có (tin này không dùng event)</td></tr><tr><td class="k">CleverTap giới hạn</td><td>Tối đa 2 lần cho mỗi khách (ngày thứ 3 và ngày thứ 10). Tính vào giới hạn chung</td></tr><tr><td class="k">Push: tiêu đề</td><td><span class="lbl">Lần 1:</span> <span class="idn">Kamu punya <code>{coin_balance}</code> Coin 🎁</span><br><span class="lbl">Lần 2:</span> <span class="idn"><code>{coin_balance}</code> Coin kamu belum dipakai</span></td></tr><tr><td class="k">Push: nội dung</td><td><span class="lbl">Lần 1:</span> <span class="idn">Coin ini dari trading kamu dan bisa ditukar dengan hadiah. Lihat pilihannya.</span><br><span class="lbl">Lần 2:</span> <span class="idn">Kurang <code>{coin_to_next_gift}</code> Coin lagi untuk <code>{next_gift_name}</code>. Cek sekarang.</span></td></tr><tr><td class="k">Email: tiêu đề</td><td><span class="idn"><code>{coin_balance}</code> Coin menunggu kamu</span></td></tr><tr><td class="k">Email preview</td><td><button type="button" class="pv" data-mail="A1" data-title="A1. Có coin nhưng chưa xem trang">Xem email preview</button><div class="pv-note">Bố cục: Thanh thương hiệu → tiêu đề lớn → đoạn chữ → thẻ quà → đoạn chữ → nút bấm → ghi chú nhỏ → chân email</div></td></tr><tr><td class="k">Câu dự phòng</td><td><div class="fb"><b>Push lần 2, khi next_gift_name trống:</b> <span class="idn">Coin kamu sudah cukup untuk ditukar dengan hadiah. Cek sekarang.</span> <span class="mean">(Coin của bạn đ tr><td class="k">Macro</td><td>week_coin, trading_days, coin_balance, coin_to_next_gift, next_gift_name, gift_1..3_name / _price / _percent / _status / _image_url</td></tr><tr><td class="k">Bấm vào thì mở</td><td>Trang chủ chương trình (đề xuất) <span class="pending">PENDING</span></td></tr><tr><td class="k">Ghi chú</td><td>Email có bảng 3 món quà kèm hình ảnh và phần trăm tiến độ</td></tr></table><h3>Nhóm: Đổi quà</h3><h4 id="msg-M12">M12. Đổi quà thành công</h4><table class="msg"><tr><td class="k">Kênh</td><td>Push</td></tr><tr><td class="k">Trigger</td><td><code>coin_redeemed</code><br>Event backend</td></tr><tr><td class="k">Lọc trong CleverTap</td><td><div>Không lọc thêm</div></td></tr><tr><td class="k">Backend giới hạn</td><td>Mỗi lần đổi quà 1 event</td></tr><tr><td class="k">CleverTap giới hạn</td><td>Không giới hạn thêm. Nằm ngoài giới hạn chung</td></tr><tr><td class="k">Push: tiêu đề</td><td><span class="idn">Coin berhasil ditukar ✅</span></td></tr><tr><td class="k">Push: nội dung</td><td><span class="idn"><code>{coin_spent}</code> Coin ditukar. Sisa saldo: <code>{coin_balance}</code> Coin. Voucher akan dikirim ke email kamu.</span></td></tr><tr><td class="k">Nghĩa tiếng Việt</td><td>Đổi Coin thành công. Đã đổi X Coin. Số dư còn Y Coin. Voucher sẽ được gửi tới email của bạn.</td></tr><tr><td class="k">Macro</td><td>coin_spent, coin_balance</td></tr><tr><td class="k">Bấm vào thì mở</td><td>Lịch sử coin (đề xuất) <span class="pending">PENDING</span></td></tr><tr><td class="k">Ghi chú</td><td>Tin này do HSB gửi qua CleverTap và chỉ xác nhận về coin (đã trừ bao nhiêu, còn bao nhiêu). Email voucher do TADA tự gửi từ hệ thống của TADA, không nằm trong CleverTap, nên M12 không có Email. Câu chữ gửi khách không nêu tên TADA hay nhắc tới đối tác. PENDING: event phụ thuộc module TADA, chưa có tại 2026-10-10</td></tr></table><h4 id="msg-M13">M13. Hoàn coin</h4><table class="msg"><tr><td class="k">Kênh</td><td>Push + Email</td></tr><tr><td class="k">Trigger</td><td>< le><div class="em"><div class="em-head">HSB Loyalty</div><div class="em-body"><div class="em-hero"><div class="em-title"><span class="l-id">Perkenalkan, HSB Loyalty 🎁</span><span class="l-vi">Xin giới thiệu, HSB Loyalty 🎁</span></div><div class="em-sub"><span class="l-id">Program hadiah baru untuk trader HSB</span><span class="l-vi">Chương trình quà tặng mới cho trader của HSB</span></div></div><p class="em-p"><span class="l-id">Mulai hari ini, trading kamu di HSB bisa menghasilkan Coin secara otomatis. Kumpulkan Coin dan tukar dengan hadiah pilihanmu.</span><span class="l-vi">Từ hôm nay, giao dịch của bạn tại HSB có thể tự động tạo ra Coin. Tích lũy Coin và đổi lấy món quà bạn chọn.</span></p><div class="em-steps"><div class="em-step"><div class="em-num">1</div><div><div class="em-st"><span class="l-id">Trading seperti biasa</span><span class="l-vi">Giao dịch như bình thường</span></div><div class="em-sd"><span class="l-id">Coin masuk otomatis saat kamu menutup posisi yang memenuhi syarat. Tidak perlu mendaftar.</span><span class="l-vi">Coin tự động vào khi bạn đóng lệnh đủ điều kiện. Không cần đăng ký.</span></div></div></div><div class="em-step"><div class="em-num">2</div><div><div class="em-st"><span class="l-id">Kumpulkan Coin</span><span class="l-vi">Tích lũy Coin</span></div><div class="em-sd"><span class="l-id">Kamu bisa mendapat 70–100 Coin per lot, tergantung jenis akun dan instrumen.</span><span class="l-vi">Bạn có thể nhận 70–100 Coin mỗi lot, tùy loại tài khoản và sản phẩm giao dịch.</span></div></div></div><div class="em-step"><div class="em-num">3</div><div><div class="em-st"><span class="l-id">Tukar dengan hadiah</span><span class="l-vi">Đổi lấy quà</span></div><div class="em-sd"><span class="l-id">Pilih hadiah di halaman HSB Loyalty. Voucher akan dikirim ke email kamu.</span><span class="l-vi">Chọn quà ở trang HSB Loyalty. Voucher sẽ được gửi tới email của bạn.</span></div></div></div></div><div class="em-cta"><span class="em-btn"><span class="l-id"
